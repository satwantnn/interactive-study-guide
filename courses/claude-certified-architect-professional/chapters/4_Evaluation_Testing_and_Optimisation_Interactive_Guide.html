<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Unofficial personal AI architecture learning guide, chapter 4"><title>Chapter 4 – Evaluation, Testing &amp; Optimisation | Interactive Study Guide</title><style>

:root{--bg1:#FAF5FF;--bg2:#FFF1F6;--surface:rgba(255,255,255,.82);--surface-strong:#ffffff;--text:#172033;--muted:#596579;--line:rgba(148,163,184,.22);--accent:#7C3AED;--accent2:#EC4899;--accent3:#A78BFA;--wash:#F5EDFF;--wash2:#FDF2F8;--side1:#FDFBFF;--side2:#F7F3FF;--shadow:0 18px 45px rgba(15,23,42,.08);--shadow-soft:0 10px 24px rgba(15,23,42,.06);--glow:0 10px 30px color-mix(in srgb, var(--accent2) 18%, transparent);}

</style></head><body><div class="app"><aside class="side"><div class="logo">AI ARCHITECTURE · PERSONAL STUDY</div><h2>Chapter 4<br>Evaluation, Testing &amp; Optimisation</h2><div class="sub" id="pct"></div><div class="progress"><div id="bar" class="bar"></div></div><button class="navbtn" onclick="overview()"><b>⌂ Chapter overview</b></button><div id="nav" class="navlist"></div><p class="sub">Your progress is stored only in this browser.</p><p class="sub"><a href="https://claudecertificationguide.com/ccar-p/learn" target="_blank" rel="noopener">Original CCAR-P curriculum ↗</a></p></aside><main class="main" id="content"></main></div><script>
const DATA={"num": 4, "name": "Evaluation, Testing & Optimisation", "lessons": [{"id": "4.1", "title": "Defining Evaluation Metrics", "url": "https://claudecertificationguide.com/ccar-p/learn/4-evaluation-testing/4-1-defining-evaluation-metrics", "objective": "Decide what “good” means using measurable targets before building.", "example": "Measure correct integration classification, source citation quality, p95 response time, and cost per case.", "strategy": "Write metric, test method, baseline, target and owner for each outcome.", "pitfall": "“Accurate answers” is a wish, not a testable metric.", "question": "Which metric is actionable?", "right": "At least 95% correct fields on a held-out test set", "wrong": "Answers should be good"}, {"id": "4.2", "title": "Designing Evaluation Datasets and Test Frameworks", "url": "https://claudecertificationguide.com/ccar-p/learn/4-evaluation-testing/4-2-evaluation-datasets-test-frameworks", "objective": "Build representative test cases so improvements are measured fairly.", "example": "Include AWS, Azure, APIM and Sensor cases with easy, ambiguous and failure examples.", "strategy": "Collect representative samples; label expected behavior; reserve a holdout set; automate repeatable tests.", "pitfall": "Testing only friendly demo examples exaggerates success.", "question": "Why keep a held-out test set?", "right": "To assess changes on examples not used for tuning", "wrong": "To make prompt writing faster"}, {"id": "4.3", "title": "A/B Testing and Iterative Improvement", "url": "https://claudecertificationguide.com/ccar-p/learn/4-evaluation-testing/4-3-ab-testing-iterative-improvement", "objective": "Compare two versions on the same task using evidence instead of intuition.", "example": "Compare an old case-summary prompt to a new one on identical Salesforce cases.", "strategy": "State a hypothesis; run paired cases; compare quality/cost/latency; check significance and regressions.", "pitfall": "One attractive response is not proof that a prompt improved.", "question": "How should two prompts be compared fairly?", "right": "Run both on the same representative questions", "wrong": "Compare unrelated sample questions"}, {"id": "4.4", "title": "Diagnosing Prompt Failure, Hallucination, and Model Mismatch", "url": "https://claudecertificationguide.com/ccar-p/learn/4-evaluation-testing/4-4-diagnosing-system-issues", "objective": "Find which component caused a bad answer before changing everything.", "example": "A wrong API version might come from stale retrieval, an unclear prompt, or the model inventing a detail.", "strategy": "Reproduce; inspect input and evidence; check retrieval; validate instructions and model fit; change one factor.", "pitfall": "Using a stronger model will not fix missing or unauthorized source data.", "question": "A hallucinated setting was absent from retrieved docs. First investigate?", "right": "Retrieval coverage and grounding", "wrong": "Only model temperature"}, {"id": "4.5", "title": "Optimising Token Usage, Latency, and Cost-Performance Trade-offs", "url": "https://claudecertificationguide.com/ccar-p/learn/4-evaluation-testing/4-5-token-latency-cost-optimisation", "objective": "Lower cost without breaking accuracy or service targets.", "example": "Route short API status questions to a cheaper model; reserve long investigation for complex incidents.", "strategy": "Measure token mix and p95; trim irrelevant context; cache repeatable prefixes; benchmark small models.", "pitfall": "Cutting tokens is not a win if it destroys necessary evidence.", "question": "Which change is safest to validate first?", "right": "Remove unused context and retest quality", "wrong": "Drop all evidence citations"}, {"id": "4.6", "title": "Monitoring System Performance in Production", "url": "https://claudecertificationguide.com/ccar-p/learn/4-evaluation-testing/4-6-monitoring-observability", "objective": "Keep measuring after launch because real inputs change.", "example": "Watch wrong classifications, failed connectors, timeouts, escalating token use and human corrections.", "strategy": "Collect traces and sampled evals; monitor drift, regressions and cost; set alert owners and rollback steps.", "pitfall": "Passing pre-launch tests does not guarantee healthy production behavior.", "question": "Model quality falls after a knowledge-base update. What helps detect it?", "right": "Ongoing sampled evaluations", "wrong": "Only infrastructure CPU metrics"}]};const chapter=DATA.num,lessons=DATA.lessons;let current=-1, tab='learn', flipped=false;const prefix='ai-study-ch'+chapter+'-';const $=x=>document.getElementById(x), esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');function done(i){return localStorage.getItem(prefix+lessons[i].id)==='1'}function setProgress(){let n=lessons.filter((_,i)=>done(i)).length;$('pct').innerText=n+' / '+lessons.length+' completed';$('bar').style.width=(100*n/lessons.length)+'%';document.querySelectorAll('#nav .navbtn').forEach((b,i)=>{b.querySelector('.status').textContent=done(i)?'✓ Completed':'Not completed'});}function renderNav(){ $('nav').innerHTML=lessons.map((l,i)=>`<button class="navbtn" onclick="openLesson(${i})"><b>${esc(l.id)} ${esc(l.title)}</b><small class="status"></small></button>`).join('');setProgress()}function openLesson(i){current=i;tab='learn';flipped=false;document.querySelectorAll('#nav .navbtn').forEach((b,j)=>b.classList.toggle('active',i===j));document.querySelector('.side > .navbtn').classList.remove('active');render();window.scrollTo({top:0,behavior:'instant'})}function overview(){current=-1;document.querySelectorAll('#nav .navbtn').forEach(b=>b.classList.remove('active'));document.querySelector('.side > .navbtn').classList.add('active');render()}function render(){if(current<0){$('content').innerHTML=`<section class="hero"><div class="eyebrow">Personal learning companion · Chapter ${chapter}</div><h1>${esc(DATA.name)}</h1><p>Simple English, colorful core objectives, practical API Security examples, strategies, flashcards and self-check questions.</p><span class="pill">${lessons.length} lessons</span></section><div class="card"><h3>How to study</h3><p>Open a lesson → read the core objective → review the example and strategy → answer the quiz → mark complete. Your progress is saved on this browser.</p></div><div class="overview">${lessons.map((l,i)=>`<button class="lessoncard" onclick="openLesson(${i})"><small>Lesson ${esc(l.id)}</small><strong>${esc(l.title)}</strong><small>${done(i)?'✓ Completed':'Start lesson →'}</small></button>`).join('')}</div>`;return;}let l=lessons[current];$('content').innerHTML=`<div class="hero"><div class="eyebrow">Chapter ${chapter} · Lesson ${esc(l.id)}</div><h1>${esc(l.title)}</h1><p>One core concept, one practical scenario, and one decision rule to remember.</p><a href="${l.url}" target="_blank" rel="noopener noreferrer">Read original article ↗</a></div><div class="tabs">${[['learn','Learn'],['strategy','Strategy'],['example','Worked example'],['flash','Flashcard'],['quiz','Quiz']].map(([k,v])=>`<button class="tab ${tab===k?'active':''}" onclick="showTab('${k}')">${v}</button>`).join('')}</div><div id="body"></div><div class="actions"><button class="secondary" onclick="${current?'openLesson('+(current-1)+')':'overview()'}">← ${current?'Previous lesson':'Chapter overview'}</button><button class="primary" onclick="localStorage.setItem(prefix+'${l.id}',done(${current})?'0':'1');setProgress();render()">${done(current)?'✓ Completed (click to undo)':'Mark lesson complete ✓'}</button><button class="secondary" onclick="${current<lessons.length-1?'openLesson('+(current+1)+')':'overview()'}">${current<lessons.length-1?'Next lesson →':'Chapter overview →'}</button></div><div class="footer">Original learning source: <a href="${l.url}" target="_blank" rel="noopener noreferrer">AI Cert Guides / Claude Certification Guide – lesson ${esc(l.id)}</a>. This is an unofficial independently written personal learning aid. It is not endorsed by or affiliated with the course publisher or Anthropic.</div>`;drawTab()}function showTab(v){tab=v;flipped=false;render()}function drawTab(){let l=lessons[current],b=$('body');if(tab==='learn')b.innerHTML=`<div class="card core"><div class="tag">Core objective · remember this</div><h3>${esc(l.objective)}</h3></div><div class="cards"><div class="card objective"><div class="tag">In plain English</div><p>${esc(l.objective)}</p></div><div class="card objective"><div class="tag">Architecture rule</div><p>${esc(l.pitfall)}</p></div></div><div class="card"><h3>What you should be able to explain</h3><p>1. What problem this concept solves.</p><p>2. How to apply it to a real enterprise AI workflow.</p><p>3. Which common mistake to avoid.</p></div>`;if(tab==='strategy')b.innerHTML=`<div class="card"><div class="tag">Decision strategy</div><h3>How to approach an exam or design scenario</h3>${l.strategy.split('; ').map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div>${esc(s.charAt(0).toUpperCase()+s.slice(1))}</div></div>`).join('')}</div><div class="card core"><div class="tag">Exam decision tip</div><p>${esc(l.pitfall)}</p></div>`;if(tab==='example')b.innerHTML=`<div class="card"><div class="tag">API Security scenario · illustrative</div><h3>How this appears at work</h3><p>${esc(l.example)}</p></div><div class="card objective"><div class="tag">What to do</div><p>${esc(l.strategy)}</p></div><div class="card"><h3>Explain it to a colleague</h3><p>“${esc(l.objective)}”</p><p class="sub">Think about how this changes architecture, permissions, speed, quality, cost, or operational risk.</p></div>`;if(tab==='flash')b.innerHTML=`<div class="card"><h3>Recall the main lesson without looking</h3><div class="flash" onclick="flipped=!flipped;drawTab()">${flipped?esc(l.objective):'What is the core architectural lesson of '+esc(l.id)+'?'}<br><small style="font-size:12px">Tap to ${flipped?'hide':'reveal'} answer</small></div><p class="sub">Try to say the answer in your own words before flipping.</p></div>`;if(tab==='quiz')b.innerHTML=`<div class="card"><div class="tag">Knowledge check</div><h3>${esc(l.question)}</h3><button class="quizopt" onclick="answer(true)">A. ${esc(l.right)}</button><button class="quizopt" onclick="answer(false)">B. ${esc(l.wrong)}</button><div class="feedback" id="feedback" aria-live="polite"></div><p class="sub">Answers are intentionally simple. Use the original article for full nuance.</p></div>`}function answer(ok){$('feedback').innerHTML=ok?'✅ Correct. '+esc(lessons[current].objective):'❌ Not quite. '+esc(lessons[current].pitfall)}renderNav();overview();
</script></body></html>
