<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 6 — Expanded Study Guide</title><style>
:root{--a:#ba5806;--b:#ec4899;--wash:#fffae7;--ink:#172339;--muted:#59677c;--line:#e7e9f0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 0%,color-mix(in srgb,var(--b) 13%,white),transparent 40%),#f7f8fc;color:var(--ink);font:16px/1.7 system-ui,-apple-system,Segoe UI,Arial,sans-serif}button{font:inherit;cursor:pointer}a{color:var(--a)}.layout{display:grid;grid-template-columns:305px minmax(0,1fr);min-height:100vh}.sidebar{height:100vh;overflow:auto;position:sticky;top:0;padding:24px 16px;background:linear-gradient(180deg,#fff,var(--wash));border-right:1px solid #e0e5ef}.brand{font-size:12px;letter-spacing:.14em;font-weight:900;color:var(--a)}.sidebar h1{font-size:22px;line-height:1.22;margin:12px 0}.note{font-size:12px;color:var(--muted)}.meter{height:10px;background:#e5e9f1;border-radius:20px;overflow:hidden;margin:15px 0}.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}.navbutton{display:block;border:1px solid transparent;background:transparent;text-align:left;width:100%;margin:5px 0;padding:11px 12px;border-radius:14px;color:#27344b}.navbutton:hover{background:white}.navbutton.active{background:linear-gradient(110deg,color-mix(in srgb,var(--a) 13%,white),color-mix(in srgb,var(--b) 12%,white));border-color:color-mix(in srgb,var(--a) 20%,white);font-weight:800;box-shadow:0 5px 19px #141c3010}.navbutton small{display:block;color:var(--muted);font-size:11px}.main{width:100%;max-width:1230px;margin:auto;padding:32px clamp(18px,4vw,62px) 80px}.hero{color:white;padding:32px;border-radius:26px;background:linear-gradient(115deg,var(--a),var(--b));box-shadow:0 16px 36px #1920361a}.hero h1{font-size:clamp(27px,3.5vw,43px);line-height:1.17;margin:10px 0}.hero a{color:white}.hero p{max-width:900px}.kicker{font-size:12px;letter-spacing:.14em;font-weight:900;text-transform:uppercase}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.tab,.btn{border:1px solid #e1e6ef;background:white;padding:10px 15px;border-radius:13px;color:#2c3b50;box-shadow:0 3px 10px #11202f09}.tab.active,.btn.primary{background:linear-gradient(115deg,var(--a),var(--b));color:white;border-color:transparent}.card{background:white;border:1px solid #e9eaf1;box-shadow:0 8px 24px #1822380b;border-radius:20px;padding:24px;margin:15px 0}.card h2{font-size:23px;line-height:1.3;margin:0 0 10px}.card h3{font-size:18px;margin:0 0 8px}.card p{margin:8px 0}.key{background:linear-gradient(115deg,var(--wash),white);border-left:6px solid var(--a)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.grid>.card{margin:0}.topic{border-left:5px solid var(--b)}.topic h3{color:var(--a)}.why{background:var(--wash);padding:13px 15px;border-radius:12px;margin-top:13px!important}.muted{color:var(--muted)}.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--a);font-weight:900}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.flash{padding:37px 26px;min-height:170px;border:2px dashed var(--b);border-radius:19px;background:var(--wash);cursor:pointer;text-align:center;font-weight:800;font-size:20px}.choice{width:100%;display:block;text-align:left;border:1px solid #dce1ea;background:white;border-radius:13px;padding:13px;margin:10px 0}.choice:hover{border-color:var(--a)}.answer{margin:15px 0;padding:14px;border-radius:12px;background:var(--wash)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:11px;text-align:left;vertical-align:top;border-bottom:1px solid #e6eaf1}th{background:var(--wash)}.scroll{overflow-x:auto}.lesson-tile{display:block;width:100%;background:white;text-align:left;border:1px solid #e4e8ef;border-radius:16px;padding:18px;min-height:128px}.lesson-tile:hover{border-color:var(--b);transform:translateY(-1px)}.lesson-tile strong{display:block}.source{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;margin-top:38px}ol li{margin-bottom:10px}@media(max-width:850px){.layout{display:block}.sidebar{height:auto;position:relative;max-height:370px}.navlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:17px}.hero{padding:23px}.card{padding:18px}}@media(max-width:500px){.navlist{grid-template-columns:1fr}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand">AI ARCHITECT · DEEP STUDY</div><h1>🤝 Chapter 6<br>Stakeholder Communication &amp; Lifecycle Management</h1><div class="note" id="count"></div><div class="meter"><div id="meter"></div></div><button class="navbutton" id="homebtn" onclick="overview()"><b>⌂ Chapter overview</b></button><div class="navlist" id="nav"></div><p class="note">Progress saved in this browser. Original: <a href="https://claudecertificationguide.com/ccar-p/learn" target="_blank" rel="noopener">Claude Certification Guide</a>.</p></aside><main class="main" id="content"></main></div><script>
const DATA={"num":6,"name":"Stakeholder Communication & Lifecycle Management","lessons":[{"id":"6.1","title":"Structured Discovery and Requirement Gathering","url":"https://claudecertificationguide.com/ccar-p/learn/6-stakeholder-lifecycle/6-1-structured-discovery","objective":"Find the real business problem and constraints before recommending a tool.","example":"For a customer requesting “AI for all API alerts,” establish alert volume, false positives, response time and ownership.","strategy":"Interview users; map workflow and risks; baseline current cost; agree on outputs, targets and constraints.","pitfall":"A requested product feature is not necessarily the underlying requirement.","question":"Customer asks for an autonomous agent. What should happen first?","right":"Discover the real workflow and success criteria","wrong":"Immediately build the agent","topics":[["Find the problem behind the request","Stakeholders ask for tools or agents, but architects must identify the actual workflow, failure and business pain.","“We need an autonomous agent” may mean analysts need faster incident classification."],["Map actors, data and constraints","Document who performs the work, who owns sources, what systems and permissions are involved, and what latency, risk and compliance constraints apply.","Identify which customer-team members can approve Kubernetes changes."],["Baseline and measurable outcome","Measure current time, throughput, defects and cost. Agree on target improvement and test conditions before proposing architecture.","Reduce human time per verified summary while holding factual-error rate below a threshold."],["Decisions and open assumptions","Write unresolved data access, integration and ownership questions explicitly and assign follow-up owners.","If an upstream API has no guaranteed availability, mark that as a design risk instead of assuming it works."]]},{"id":"6.2","title":"Communicating Architectural Decisions and Trade-offs","url":"https://claudecertificationguide.com/ccar-p/learn/6-stakeholder-lifecycle/6-2-communicating-decisions-trade-offs","objective":"Explain your choice, alternatives and consequences in business language.","example":"Compare a read-only case assistant with an autonomous remediation agent using risk, cost and operational ownership.","strategy":"Present goal; options; decision criteria; recommendation; known risks and decision owner.","pitfall":"A diagram without rationale does not help a stakeholder approve the decision.","question":"What makes a decision defensible?","right":"Documented trade-offs and evidence","wrong":"A confident product recommendation","topics":[["Communicate the decision, not the diagram","Stakeholders need context, options, criteria and consequences. An elegant diagram alone does not justify a choice.","Compare a fixed workflow with an autonomous agent on cost, latency, control and auditability."],["Trade-offs in business terms","Translate token spend into cost per case, latency into user wait time, and tool permissions into operational consequences.","A slower but reviewed production change may be justified; a slower low-risk lookup may not."],["Architecture decision records","Capture decision, alternatives, evidence, known risks, accountable owner and revisit triggers. Preserve the reasoning when choices change.","Record why a remote-execution capability was excluded and when that decision must be revisited."],["Risk acceptance is a stakeholder decision","Technical teams can define safeguards and residual exposure; authorized business owners accept remaining risk.","A product owner signs off on the remaining false-positive rate after testing."]]},{"id":"6.3","title":"Expectation Alignment and Service-Level Commitments","url":"https://claudecertificationguide.com/ccar-p/learn/6-stakeholder-lifecycle/6-3-expectation-alignment-and-slas","objective":"Agree on what service will do, how well, and how failure is handled.","example":"Define API triage assistant response p95, allowed errors, support hours and escalation on low-confidence answers.","strategy":"Separate pilot from production commitments; set measurable SLOs; define exclusions and fallback.","pitfall":"Average latency does not represent the slowest experiences.","question":"For user-facing reliability, what is more useful?","right":"Percentile latency plus failure targets","wrong":"Only mean response time","topics":[["Define the service envelope","Clarify functional scope, quality bar, availability, latency percentile and support coverage; distinguish pilot goals from contractual commitments.","A summary assistant may promise a p95 response time but not zero hallucinations."],["Budget tail latency","Users experience slow outliers; report p95/p99, not only average duration. Include retrieval, tools and model stages in the critical path.","A three-call chain cannot be judged using the latency of only the first model call."],["Failure and fallback","Set timeout, queue, escalation, degraded mode, and who is contacted during failures. Distinguish what the product guarantees from what upstream services provide.","If a connector is unavailable, show a clear insufficient-data message instead of guessing."],["Keep expectations measured","Make claims only when evaluations and operating data support them. Record exclusions and change conditions.","Do not promise a compliance accuracy target based on five demo questions."]]},{"id":"6.4","title":"Documentation and Implementation Guidance","url":"https://claudecertificationguide.com/ccar-p/learn/6-stakeholder-lifecycle/6-4-documentation-and-implementation-guidance","objective":"Write documents engineers can follow and maintain, not just a high-level diagram.","example":"Document API gateway integration prerequisites, version compatibility, permissions, validation and rollback.","strategy":"Provide architecture, numbered setup, verification, failure handling, owners and update date.","pitfall":"A deployment guide missing rollback is incomplete for production.","question":"What should a strong install guide include?","right":"Prerequisites, checks and rollback","wrong":"Only a screenshot of success","topics":[["Architecture and trust-boundary documentation","Document data flows, system dependencies, permissions, decision points and where controls enforce safety.","An engineer should know which service holds API credentials and which authorization check guards them."],["Runnable implementation guidance","Include prerequisites, versions, configuration steps, verification commands, common failure cases and rollback.","A deployment guide must tell an on-call engineer how to confirm the engine is healthy."],["Runbooks written for incidents","Provide symptoms, evidence to capture, diagnostic order, containment, escalation, owner and recovery validation.","For a failed integration, capture pod logs and failing version before altering configuration."],["Handover means capability transfer","The receiving team must know how to run evals, inspect traces, roll back and ask for help.","A code repository with no evaluation baseline is not sufficient operational documentation."]]},{"id":"6.5","title":"Supporting the Lifecycle Phases","url":"https://claudecertificationguide.com/ccar-p/learn/6-stakeholder-lifecycle/6-5-lifecycle-phases","objective":"Plan discovery, pilot, rollout, operations and retirement as one lifecycle.","example":"Move an API incident assistant from limited pilot to production with monitors, on-call handoff and exit criteria.","strategy":"Set stage gates; capture ownership; train operations; plan upgrades, reevaluation and decommission.","pitfall":"A technically successful demo is not an operationally supported system.","question":"When does lifecycle ownership end?","right":"After retirement and data cleanup","wrong":"At pilot demo","topics":[["Discovery and design gates","Discovery exits when the real problem, constraints, baseline and owners are agreed. Design exits with architecture, risk controls and an evaluation plan.","Do not jump from a successful demo to production if the data-processing boundaries remain unresolved."],["Build and validate","Implementation must prove agreed quality, latency, safety and cost thresholds using representative test data.","A chatbot passing a happy-path demonstration has not passed production readiness."],["Handoff and operations","Transfer runbooks, access, trace interpretation, rollback ability and on-call ownership. Continue evaluations as knowledge and traffic change.","Know who can disable a risky tool in an incident."],["Iteration and retirement","Return to earlier phases when new facts invalidate assumptions. Plan version upgrades, retention, decommissioning and data cleanup.","Retire an integration by revoking credentials and removing stored data, not merely hiding a UI button."]]}],"emoji":"🤝"};const ID=DATA.num;const L=DATA.lessons;let idx=-1,tab='learn',flipped=false,answered=false;
const $=id=>document.getElementById(id);const e=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const saved=i=>localStorage.getItem('expanded-guide-'+ID+'-'+L[i].id)==='yes';
function refreshNav(){let count=L.filter((v,i)=>saved(i)).length;$('count').textContent=count+' / '+L.length+' completed';$('meter').style.width=(100*count/L.length)+'%';$('nav').innerHTML=L.map((l,i)=>`<button class="navbutton ${idx===i?'active':''}" onclick="openLesson(${i})"><b>${e(l.id)} ${e(l.title)}</b><small>${saved(i)?'✓ Completed':l.topics.length+' key concepts'}</small></button>`).join('');$('homebtn').classList.toggle('active',idx===-1)}
function overview(){idx=-1;render()}
function openLesson(i){idx=i;tab='learn';flipped=false;answered=false;window.__flashIndex=0;render();window.scrollTo(0,0)}
function switchTab(t){tab=t;flipped=false;answered=false;render()}
function toggleDone(){const key='expanded-guide-'+ID+'-'+L[idx].id;localStorage.setItem(key,saved(idx)?'no':'yes');render()}
function topicCard(t){return `<article class="card topic"><h3>${e(t[0])}</h3><p>${e(t[1])}</p><p class="why"><b>Apply it:</b> ${e(t[2])}</p></article>`}
function render(){refreshNav();if(idx<0){$('content').innerHTML=`<header class="hero"><div class="kicker">Expanded personal study · Chapter ${ID}</div><h1>${DATA.emoji} ${e(DATA.name)}</h1><p>In-depth, plain-English lessons covering key mechanisms, controls, architecture decisions, examples and practice. Read the detailed concept pages before taking the quiz.</p></header><section class="card"><h2>How to use this guide</h2><p>Choose a lesson in the sidebar. The <b>Learn</b> tab explains each major concept in its own section; <b>Strategy</b> provides a practical checklist; <b>Example</b> applies it to API Security; then test yourself with flashcards and a quiz. These are independently written learning notes with direct links to the original articles.</p></section><div class="grid">${L.map((l,i)=>`<button class="lesson-tile" onclick="openLesson(${i})"><span class="label">Lesson ${e(l.id)}</span><strong>${e(l.title)}</strong><span class="muted">${l.topics.length} concepts · ${saved(i)?'✓ Completed':'Begin →'}</span></button>`).join('')}</div>`;return}
const l=L[idx];let parts=`<header class="hero"><div class="kicker">Chapter ${ID} · Lesson ${e(l.id)}</div><h1>${e(l.title)}</h1><p>${e(l.objective)}</p><a href="${e(l.url)}" target="_blank" rel="noopener noreferrer">Read the original lesson ↗</a></header><nav class="tabs">${[['learn','📖 Learn'],['strategy','🧭 Strategy'],['example','🧩 Worked example'],['flash','🃏 Flashcards'],['quiz','✅ Quiz']].map(v=>`<button class="tab ${tab===v[0]?'active':''}" onclick="switchTab('${v[0]}')">${v[1]}</button>`).join('')}</nav>`;
if(tab==='learn'){parts+=`<section class="card key"><span class="label">Core learning objective</span><h2>${e(l.objective)}</h2><p>Learn each of the ${l.topics.length} concepts below; together they explain what can go wrong, what changes in the architecture, and how to decide in an exam scenario.</p></section>${l.topics.map(topicCard).join('')}`;if(l.id==='5.2')parts+=riskTable();parts+=`<section class="card"><h3>Common mistake to avoid</h3><p>${e(l.pitfall)}</p></section>`}
if(tab==='strategy'){parts+=`<section class="card"><h2>Architecture decision checklist</h2><ol>${l.strategy.split(';').map(v=>`<li>${e(v.trim())}</li>`).join('')}</ol></section><section class="card"><h2>How to defend the design</h2><p>Explain the requirement, the consequence of failure, the precise safeguard, the measurable evidence that it works, and who owns remaining risk. For this lesson, use the concepts below as your reference.</p></section>${l.topics.map((t,i)=>`<section class="card"><span class="label">Decision ${i+1}</span><h3>${e(t[0])}</h3><p>${e(t[2])}</p></section>`).join('')}`}
if(tab==='example'){parts+=`<section class="card"><h2>API Security worked scenario</h2><p>${e(l.example)}</p><h3>Walk through it</h3><ol><li>Identify the real-world problem and who could be affected if the assistant is wrong.</li><li>Find which of the lesson concepts explains the failure and the correct architecture boundary.</li><li>Choose a technical safeguard and a way to test or monitor it.</li><li>Document the decision, its limits and the accountable owner.</li></ol></section>${l.topics.map(t=>`<section class="card"><h3>${e(t[0])}</h3><p>${e(t[2])}</p></section>`).join('')}`}
if(tab==='flash'){const card=l.topics[window.__flashIndex||0];parts+=`<section class="card"><div class="label">Card ${(window.__flashIndex||0)+1} of ${l.topics.length}</div><button class="flash" style="width:100%" onclick="flipped=!flipped;render()">${flipped?e(card[1]):'Explain: '+e(card[0])}<div class="note">Tap to ${flipped?'see the prompt':'reveal the answer'}</div></button><div class="actions"><button class="btn" onclick="window.__flashIndex=Math.max(0,(window.__flashIndex||0)-1);flipped=false;render()">← Previous card</button><button class="btn primary" onclick="window.__flashIndex=((window.__flashIndex||0)+1)%L[idx].topics.length;flipped=false;render()">Next card →</button></div></section>`}
if(tab==='quiz'){parts+=`<section class="card"><h2>Knowledge check</h2><h3>${e(l.question)}</h3><button class="choice" onclick="showAnswer(true)">A. ${e(l.right)}</button><button class="choice" onclick="showAnswer(false)">B. ${e(l.wrong)}</button><div id="feedback" class="answer" style="display:none"></div></section>`;if(l.id==='5.2')parts+=`<section class="card"><h3>Extra practice</h3><p>An assistant can issue refunds, has 98% task accuracy, and no alert for incorrect refunds. Which risk-register fields are still missing?</p><details><summary>Reveal suggested answer</summary><p>The score does not specify the refund error's mechanism, blast radius and reversibility, detection signal, enforcing control and control surface, or who accepted the residual risk. Add an approve-before-execute gate and a refund reconciliation alert; assign owners and test both.</p></details></section>`}
parts+=`<div class="actions"><button class="btn" onclick="${idx>0?'openLesson('+(idx-1)+')':'overview()'}">← ${idx>0?'Previous lesson':'Overview'}</button><button class="btn primary" onclick="toggleDone()">${saved(idx)?'✓ Completed (undo)':'Mark lesson complete ✓'}</button><button class="btn" onclick="${idx<L.length-1?'openLesson('+(idx+1)+')':'overview()'}">${idx<L.length-1?'Next lesson →':'Overview →'}</button></div><div class="source"><b>Original article and credit:</b> <a href="${e(l.url)}" target="_blank" rel="noopener noreferrer">${e(l.title)} · Claude Certification Guide</a>. This unofficial personal learning companion paraphrases and expands topics with independent enterprise examples; it is not a replacement for the original article, and is not affiliated with the publisher or Anthropic. Open the original lesson for complete source depth and authoritative wording.</div>`;$('content').innerHTML=parts}
function showAnswer(ok){let el=$('feedback');el.style.display='block';el.innerHTML=ok?'<b>Correct.</b> '+e(L[idx].objective):'<b>Try again.</b> '+e(L[idx].pitfall)}
function riskTable(){return `<section class="card"><h2>Risk Register — practical example</h2><p>Use all five fields for every risk. The values below are a fictional API Security case.</p><div class="scroll"><table><thead><tr><th>Field</th><th>What to write</th><th>Example</th></tr></thead><tbody><tr><td><b>Mechanism</b></td><td>Exact way the system fails</td><td>Model invents a supported Remote Engine version</td></tr><tr><td><b>Blast radius</b></td><td>Who is harmed; scale; reversible?</td><td>Wrong recommendation could break customer deployment</td></tr><tr><td><b>Detection signal</b></td><td>Observable metric, test, trace or alert</td><td>Version checker rejects unsupported recommendation</td></tr><tr><td><b>Owning control</b></td><td>Enforced safeguard and control surface</td><td>Output validator + documentation-version lookup; owner: platform team</td></tr><tr><td><b>Residual and acceptance</b></td><td>Remaining exposure and who explicitly signs off</td><td>Documentation may lag a new release; release owner accepts with human fallback</td></tr></tbody></table></div><p class="why"><b>Important:</b> “The customer will complain” is not an adequate early detection signal. Build a way to detect the problem before harm wherever possible.</p></section>`}
overview();
</script></body></html>
