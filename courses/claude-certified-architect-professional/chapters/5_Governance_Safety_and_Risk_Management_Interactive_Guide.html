Start lesson →'}</small></button>`).join('')}</div>`;return;}let l=lessons[current];$('content').innerHTML=`<div class="hero"><div class="eyebrow">Chapter ${chapter} · Lesson ${esc(l.id)}</div><h1>${esc(l.title)}</h1><p>One core concept, one practical scenario, and one decision rule to remember.</p><a href="${l.url}" target="_blank" rel="noopener noreferrer">Read original article ↗</a></div><div class="tabs">${[['learn','Learn'],['strategy','Strategy'],['example','Worked example'],['flash','Flashcard'],['quiz','Quiz']].map(([k,v])=>`<button class="tab ${tab===k?'active':''}" onclick="showTab('${k}')">${v}</button>`).join('')}</div><div id="body"></div><div class="actions"><button class="secondary" onclick="${current?'openLesson('+(current-1)+')':'overview()'}">← ${current?'Previous lesson':'Chapter overview'}</button><button class="primary" onclick="localStorage.setItem(prefix+'${l.id}',done(${current})?'0':'1');setProgress();render()">${done(current)?'✓ Completed (click to undo)':'Mark lesson complete ✓'}</button><button class="secondary" onclick="${current<lessons.length-1?'openLesson('+(current+1)+')':'overview()'}">${current<lessons.length-1?'Next lesson →':'Chapter overview →'}</button></div><div class="footer">Original learning source: <a href="${l.url}" target="_blank" rel="noopener noreferrer">AI Cert Guides / Claude Certification Guide – lesson ${esc(l.id)}</a>. This is an unofficial independently written personal learning aid. It is not endorsed by or affiliated with the course publisher or Anthropic.</div>`;drawTab()}function showTab(v){tab=v;flipped=false;render()}function drawTab(){let l=lessons[current],b=$('body');if(tab==='learn')b.innerHTML=`<div class="card core"><div class="tag">Core objective · remember this</div><h3>${esc(l.objective)}</h3></div><div class="cards"><div class="card objective"><div class="tag">In plain English</div><p>${esc(l.objective)}</p></div><div class="card objective"><div class="tag">Architecture rule</div><p>${esc(l.pitfal
