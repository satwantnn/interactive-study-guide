<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 5 — Expanded Study Guide</title><style>
:root{--a:#e11d48;--b:#fb923c;--wash:#fff1f2;--ink:#172339;--muted:#59677c;--line:#e7e9f0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 0%,color-mix(in srgb,var(--b) 13%,white),transparent 40%),#f7f8fc;color:var(--ink);font:16px/1.7 system-ui,-apple-system,Segoe UI,Arial,sans-serif}button{font:inherit;cursor:pointer}a{color:var(--a)}.layout{display:grid;grid-template-columns:305px minmax(0,1fr);min-height:100vh}.sidebar{height:100vh;overflow:auto;position:sticky;top:0;padding:24px 16px;background:linear-gradient(180deg,#fff,var(--wash));border-right:1px solid #e0e5ef}.brand{font-size:12px;letter-spacing:.14em;font-weight:900;color:var(--a)}.sidebar h1{font-size:22px;line-height:1.22;margin:12px 0}.note{font-size:12px;color:var(--muted)}.meter{height:10px;background:#e5e9f1;border-radius:20px;overflow:hidden;margin:15px 0}.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}.navbutton{display:block;border:1px solid transparent;background:transparent;text-align:left;width:100%;margin:5px 0;padding:11px 12px;border-radius:14px;color:#27344b}.navbutton:hover{background:white}.navbutton.active{background:linear-gradient(110deg,color-mix(in srgb,var(--a) 13%,white),color-mix(in srgb,var(--b) 12%,white));border-color:color-mix(in srgb,var(--a) 20%,white);font-weight:800;box-shadow:0 5px 19px #141c3010}.navbutton small{display:block;color:var(--muted);font-size:11px}.main{width:100%;max-width:1230px;margin:auto;padding:32px clamp(18px,4vw,62px) 80px}.hero{color:white;padding:32px;border-radius:26px;background:linear-gradient(115deg,var(--a),var(--b));box-shadow:0 16px 36px #1920361a}.hero h1{font-size:clamp(27px,3.5vw,43px);line-height:1.17;margin:10px 0}.hero a{color:white}.hero p{max-width:900px}.kicker{font-size:12px;letter-spacing:.14em;font-weight:900;text-transform:uppercase}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.tab,.btn{border:1px solid #e1e6ef;background:white;padding:10px 15px;border-radius:13px;color:#2c3b50;box-shadow:0 3px 10px #11202f09}.tab.active,.btn.primary{background:linear-gradient(115deg,var(--a),var(--b));color:white;border-color:transparent}.card{background:white;border:1px solid #e9eaf1;box-shadow:0 8px 24px #1822380b;border-radius:20px;padding:24px;margin:15px 0}.card h2{font-size:23px;line-height:1.3;margin:0 0 10px}.card h3{font-size:18px;margin:0 0 8px}.card p{margin:8px 0}.key{background:linear-gradient(115deg,var(--wash),white);border-left:6px solid var(--a)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.grid>.card{margin:0}.topic{border-left:5px solid var(--b)}.topic h3{color:var(--a)}.why{background:var(--wash);padding:13px 15px;border-radius:12px;margin-top:13px!important}.muted{color:var(--muted)}.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--a);font-weight:900}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.flash{padding:37px 26px;min-height:170px;border:2px dashed var(--b);border-radius:19px;background:var(--wash);cursor:pointer;text-align:center;font-weight:800;font-size:20px}.choice{width:100%;display:block;text-align:left;border:1px solid #dce1ea;background:white;border-radius:13px;padding:13px;margin:10px 0}.choice:hover{border-color:var(--a)}.answer{margin:15px 0;padding:14px;border-radius:12px;background:var(--wash)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:11px;text-align:left;vertical-align:top;border-bottom:1px solid #e6eaf1}th{background:var(--wash)}.scroll{overflow-x:auto}.lesson-tile{display:block;width:100%;background:white;text-align:left;border:1px solid #e4e8ef;border-radius:16px;padding:18px;min-height:128px}.lesson-tile:hover{border-color:var(--b);transform:translateY(-1px)}.lesson-tile strong{display:block}.source{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;margin-top:38px}ol li{margin-bottom:10px}@media(max-width:850px){.layout{display:block}.sidebar{height:auto;position:relative;max-height:370px}.navlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:17px}.hero{padding:23px}.card{padding:18px}}@media(max-width:500px){.navlist{grid-template-columns:1fr}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand">AI ARCHITECT · DEEP STUDY</div><h1>🛡️ Chapter 5<br>Governance, Safety &amp; Risk Management</h1><div class="note" id="count"></div><div class="meter"><div id="meter"></div></div><button class="navbutton" id="homebtn" onclick="overview()"><b>⌂ Chapter overview</b></button><div class="navlist" id="nav"></div><p class="note">Progress saved in this browser. Original: <a href="https://claudecertificationguide.com/ccar-p/learn" target="_blank" rel="noopener">Claude Certification Guide</a>.</p></aside><main class="main" id="content"></main></div><script>
const DATA={"num":5,"name":"Governance, Safety & Risk Management","lessons":[{"id":"5.1","title":"Guardrails, Safety Controls, and the Surface a Risk Belongs To","url":"https://claudecertificationguide.com/ccar-p/learn/5-governance-safety/5-1-guardrails-and-safety-controls","objective":"Put controls where they can actually prevent a risk: input, instructions, capability, output or architecture.","example":"Filter sensitive logs before prompting and block destructive Kubernetes actions via permissions.","strategy":"Map each risk to a control surface; enforce permissions in code; validate outputs; remove unnecessary tools.","pitfall":"“Do not misuse this tool” in a prompt cannot replace access control.","question":"Best protection against unwanted production deletion?","right":"Do not expose delete capability to the agent","wrong":"Add a polite system message","topics":[["Five control surfaces","Input checks, system instructions, capability scoping, output checks and architectural removal defend at different locations. Choose the layer that can truly prevent the named harm.","A secret must never reach the model: remove or mask it before input. A forbidden claim must never leave: enforce output validation."],["Instructions are guidance, not permissions","The system prompt can establish scope and refusal behavior but cannot revoke an API permission. Use code-enforced boundaries for guarantees.","“Never delete” does not secure a bot that holds a working delete credential."],["Prevention versus detection","Logging and alerting help notice problems; they cannot stop damage already done. Put preventive gates before irreversible actions.","An alert fired after a refund is issued is not a refund authorization control."],["Layered defenses and recovery","Validate inputs and outputs, scope tools, use human gates where appropriate, and design safe failure handling for blocked or malformed output.","A blocked draft should enter a review queue rather than silently disappear."]]},{"id":"5.2","title":"Risks, Limitations, and the Failure Modes That Stay Silent","url":"https://claudecertificationguide.com/ccar-p/learn/5-governance-safety/5-2-risks-limitations-failure-modes","objective":"Plan for convincing but wrong outputs, hidden failures and bad source data.","example":"An assistant may confidently report an engine as online using yesterday’s health snapshot.","strategy":"Identify silent failures; attach timestamps and evidence; use uncertainty flags; define escalation paths.","pitfall":"A plausible answer without current evidence can be more dangerous than a clear error.","question":"How should a stale health report be shown?","right":"Mark timestamp and uncertainty","wrong":"Present as verified current state","topics":[["Risk Register: Five Essential Fields","Each failure mode needs a mechanism (how it fails), blast radius (who or what is harmed and whether reversible), detection signal (what measurable evidence reveals it), owning control (enforced safeguard and its layer), and residual risk with a named acceptor (what remains and who approved it). A list of vague worries is not a risk register.","Example: wrong production remediation command → potential service outage → discrepancy between suggested and approved commands → human approve-before-execute plus RBAC → remaining review error risk accepted by the service owner."],["Confident Fabrication Does Not Fail Loudly","A model can produce a fluent, convincing answer that is not supported by facts. The API call succeeds, the JSON is valid, and the dashboard shows green even as the answer is wrong. This is why ordinary HTTP-error monitoring misses hallucinations.","Ask for cited evidence on consequential claims; verify version, timestamp and source. Monitor groundedness and unsupported assertions rather than only request failure rate."],["Non-Determinism, and the Assurances It Breaks","The same input may produce different responses on separate runs. One successful demo is not a performance guarantee. Re-running a disputed request does not recreate the earlier decision; the original prompt, context, retrieved data, tool calls, versions and output must be recorded.","Retain trace IDs and test multiple representative runs. For an audit, show the recorded original execution rather than claiming that a new run proves what happened."],["Injection, Restated as a Risk","An attacker can place instructions inside untrusted documents, logs, search results or tool responses. The risk is not merely that the model reads malicious text; it is what the compromised model can do with its available permissions.","An inventory assistant with read-only access has limited blast radius. An agent with a production-delete tool may not. Restrict capabilities and distinguish untrusted content from instructions."],["Autonomy Compounds Error","If an agent takes many dependent steps, a small chance of error at each stage can combine into a significant chance of one or more failures. Side effects may propagate before anyone notices.","Cap step count, require checkpoints, limit tool scope, prefer reversible operations, and put human approval before payments, deletions or production changes."],["Over-Refusal Is Also a Failure","A system that blocks every request might avoid harmful answers but fails legitimate users. Safety measurement must include incorrectly refused allowed requests alongside harmful responses allowed.","Test benign requests such as “explain read-only Kubernetes logs” so the model is not rewarded for refusing normal technical help."],["Over-Reliance and Rubber-Stamping","A human approval step is not automatically effective. Reviewers can develop automation bias and approve recommendations without checking evidence, especially when volume is high.","Measure how often reviewers correct, reject or override outputs, provide source evidence and route high-risk items to qualified reviewers."],["Third-Party Surfaces and Corpus Boundaries","Connectors, MCP servers, analytics vendors and subprocessors may see sensitive data or take actions. At the same time, retrieved knowledge may be stale, incomplete or incorrectly attributed. Both can create silent failures.","Inventory third-party access and retention obligations; monitor retrieval freshness and version compatibility. Record the owning team for each external dependency."],["Prioritise by Consequence and Detectability","A rare, irreversible, silent failure may deserve a higher priority than a common, reversible, loudly alerted one. A “customer will complain” signal is late, incomplete detection, not effective monitoring.","For each risk ask: “If this happened tonight, what log, metric or alert would change before anyone called us?” If there is no answer, improve instrumentation."]]},{"id":"5.3","title":"Human-in-the-Loop Validation: Placement, Pattern, and Proof","url":"https://claudecertificationguide.com/ccar-p/learn/5-governance-safety/5-3-human-in-the-loop-validation","objective":"Use human approval where mistakes have meaningful consequences.","example":"An AI drafts a customer-facing incident RCA; an engineer checks evidence before sending.","strategy":"Classify action risk; require review before irreversible steps; log approver and changes; test bypass paths.","pitfall":"A reviewer who sees the output after the action is too late to prevent harm.","question":"When should approval happen for production changes?","right":"Before executing the change","wrong":"After completion","topics":[["Where human review belongs","Gate actions according to consequence and reversibility. Not all work needs approval, but irreversible external effects often do.","Approvals are necessary before executing production deletion, not after it completes."],["Review before action versus review after","Approve-before-execute prevents the action without permission. Review-before-release checks consequential content. Post-hoc sampled audit fits lower-risk reversible work, not unsafe irreversible action.","Route a customer settlement statement to a reviewer before sending."],["Triggered escalation","Escalate cases with uncertainty, high value or unusual behavior. Validate triggers; do not assume an uncalibrated confidence score catches every dangerous case.","Escalate changes touching protected customer data or privileged production actions."],["Evidence that the gate works","Record who approved, what evidence they saw, what changed, how often reviewers override, and whether bypasses were possible.","Track rejection/correction rates and test whether the API blocks calls without approval."]]},{"id":"5.4","title":"Regulatory Compliance as an Architecture Constraint","url":"https://claudecertificationguide.com/ccar-p/learn/5-governance-safety/5-4-regulatory-compliance","objective":"Design data handling around applicable obligations from the beginning.","example":"A healthcare claim assistant needs authorized access, retention rules and careful handling of patient information.","strategy":"Identify laws/contracts with counsel; map data flows; minimize sensitive content; enforce retention and audit requirements.","pitfall":"Compliance is not a checkbox added after the model is live.","question":"When should data-residency rules be captured?","right":"During requirements and architecture design","wrong":"After launch","topics":[["Regulation changes the design","Jurisdiction, data classification, contract, retention and audit rules can rule out architectures before a model is chosen. Validate applicability with your legal/compliance partners.","A workflow handling sensitive claim documents may require regional storage and restricted access."],["Data mapping and minimisation","Trace what the system collects, sends to providers, stores in logs, caches and transmits to connectors. Minimise copies and define deletion.","Removing personal identifiers from the prompt does not remove them from third-party logging automatically."],["Vendor and integration boundaries","Providers and subprocessors have different policies and contracts. Do not assume that the primary model provider’s controls automatically cover external tools.","Review an MCP service’s data handling independently from the model provider."],["Evidence and accountability","Document design decisions, access logs, retention behavior, controls, test results and named owners. Compliance needs verifiable operations, not a slide marked “compliant.”","Capture an auditable record of which policy version authorized a sensitive recommendation."]]},{"id":"5.5","title":"Ethical AI: Bias, Fairness, and Transparency","url":"https://claudecertificationguide.com/ccar-p/learn/5-governance-safety/5-5-ethical-ai-bias-fairness-transparency","objective":"Test whether outcomes are unfair, explain limitations and provide appropriate review.","example":"A banking loan-support assistant must not give systematically weaker help to some applicant groups.","strategy":"Define fairness checks; evaluate representative populations; document limits; offer appeal or human review.","pitfall":"One aggregate accuracy score can conceal unfair performance gaps.","question":"Why compare performance across groups?","right":"To detect uneven error patterns","wrong":"To maximize token usage","topics":[["Where bias enters","Bias can come from training data, labels, missing populations, human assumptions, objective functions or inaccessible interfaces. It is not limited to explicit sensitive attributes.","A support prioritization model may treat writing style as a proxy for customer importance."],["Proxy features","Dropping sensitive fields alone does not guarantee fairness because other attributes can correlate with them.","Job title, zip code or writing style may indirectly encode differences that require testing."],["Disaggregated evaluation","Aggregate accuracy can hide poor performance for a minority cohort. Define a harm hypothesis and compare relevant outcomes across groups with appropriate governance.","Measure whether case summaries are less faithful for non-native English customer messages."],["Transparency and recourse","Explain intended use, uncertainty, limitations and how people can contest important decisions. Keep accountable human ownership for consequential uses.","An applicant should be able to request review of an AI-assisted decision."]]}],"emoji":"🛡️"};const ID=DATA.num;const L=DATA.lessons;let idx=-1,tab='learn',flipped=false,answered=false;
const $=id=>document.getElementById(id);const e=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const saved=i=>localStorage.getItem('expanded-guide-'+ID+'-'+L[i].id)==='yes';
function refreshNav(){let count=L.filter((v,i)=>saved(i)).length;$('count').textContent=count+' / '+L.length+' completed';$('meter').style.width=(100*count/L.length)+'%';$('nav').innerHTML=L.map((l,i)=>`<button class="navbutton ${idx===i?'active':''}" onclick="openLesson(${i})"><b>${e(l.id)} ${e(l.title)}</b><small>${saved(i)?'✓ Completed':l.topics.length+' key concepts'}</small></button>`).join('');$('homebtn').classList.toggle('active',idx===-1)}
function overview(){idx=-1;render()}
function openLesson(i){idx=i;tab='learn';flipped=false;answered=false;window.__flashIndex=0;render();window.scrollTo(0,0)}
function switchTab(t){tab=t;flipped=false;answered=false;render()}
function toggleDone(){const key='expanded-guide-'+ID+'-'+L[idx].id;localStorage.setItem(key,saved(idx)?'no':'yes');render()}
function topicCard(t){return `<article class="card topic"><h3>${e(t[0])}</h3><p>${e(t[1])}</p><p class="why"><b>Apply it:</b> ${e(t[2])}</p></article>`}
function render(){refreshNav();if(idx<0){$('content').innerHTML=`<header class="hero"><div class="kicker">Expanded personal study · Chapter ${ID}</div><h1>${DATA.emoji} ${e(DATA.name)}</h1><p>In-depth, plain-English lessons covering key mechanisms, controls, architecture decisions, examples and practice. Read the detailed concept pages before taking the quiz.</p></header><section class="card"><h2>How to use this guide</h2><p>Choose a lesson in the sidebar. The <b>Learn</b> tab explains each major concept in its own section; <b>Strategy</b> provides a practical checklist; <b>Example</b> applies it to API Security; then test yourself with flashcards and a quiz. These are independently written learning notes with direct links to the original articles.</p></section><div class="grid">${L.map((l,i)=>`<button class="lesson-tile" onclick="openLesson(${i})"><span class="label">Lesson ${e(l.id)}</span><strong>${e(l.title)}</strong><span class="muted">${l.topics.length} concepts · ${saved(i)?'✓ Completed':'Begin →'}</span></button>`).join('')}</div>`;return}
const l=L[idx];let parts=`<header class="hero"><div class="kicker">Chapter ${ID} · Lesson ${e(l.id)}</div><h1>${e(l.title)}</h1><p>${e(l.objective)}</p><a href="${e(l.url)}" target="_blank" rel="noopener noreferrer">Read the original lesson ↗</a></header><nav class="tabs">${[['learn','📖 Learn'],['strategy','🧭 Strategy'],['example','🧩 Worked example'],['flash','🃏 Flashcards'],['quiz','✅ Quiz']].map(v=>`<button class="tab ${tab===v[0]?'active':''}" onclick="switchTab('${v[0]}')">${v[1]}</button>`).join('')}</nav>`;
if(tab==='learn'){parts+=`<section class="card key"><span class="label">Core learning objective</span><h2>${e(l.objective)}</h2><p>Learn each of the ${l.topics.length} concepts below; together they explain what can go wrong, what changes in the architecture, and how to decide in an exam scenario.</p></section>${l.topics.map(topicCard).join('')}`;if(l.id==='5.2')parts+=riskTable();parts+=`<section class="card"><h3>Common mistake to avoid</h3><p>${e(l.pitfall)}</p></section>`}
if(tab==='strategy'){parts+=`<section class="card"><h2>Architecture decision checklist</h2><ol>${l.strategy.split(';').map(v=>`<li>${e(v.trim())}</li>`).join('')}</ol></section><section class="card"><h2>How to defend the design</h2><p>Explain the requirement, the consequence of failure, the precise safeguard, the measurable evidence that it works, and who owns remaining risk. For this lesson, use the concepts below as your reference.</p></section>${l.topics.map((t,i)=>`<section class="card"><span class="label">Decision ${i+1}</span><h3>${e(t[0])}</h3><p>${e(t[2])}</p></section>`).join('')}`}
if(tab==='example'){parts+=`<section class="card"><h2>API Security worked scenario</h2><p>${e(l.example)}</p><h3>Walk through it</h3><ol><li>Identify the real-world problem and who could be affected if the assistant is wrong.</li><li>Find which of the lesson concepts explains the failure and the correct architecture boundary.</li><li>Choose a technical safeguard and a way to test or monitor it.</li><li>Document the decision, its limits and the accountable owner.</li></ol></section>${l.topics.map(t=>`<section class="card"><h3>${e(t[0])}</h3><p>${e(t[2])}</p></section>`).join('')}`}
if(tab==='flash'){const card=l.topics[window.__flashIndex||0];parts+=`<section class="card"><div class="label">Card ${(window.__flashIndex||0)+1} of ${l.topics.length}</div><button class="flash" style="width:100%" onclick="flipped=!flipped;render()">${flipped?e(card[1]):'Explain: '+e(card[0])}<div class="note">Tap to ${flipped?'see the prompt':'reveal the answer'}</div></button><div class="actions"><button class="btn" onclick="window.__flashIndex=Math.max(0,(window.__flashIndex||0)-1);flipped=false;render()">← Previous card</button><button class="btn primary" onclick="window.__flashIndex=((window.__flashIndex||0)+1)%L[idx].topics.length;flipped=false;render()">Next card →</button></div></section>`}
if(tab==='quiz'){parts+=`<section class="card"><h2>Knowledge check</h2><h3>${e(l.question)}</h3><button class="choice" onclick="showAnswer(true)">A. ${e(l.right)}</button><button class="choice" onclick="showAnswer(false)">B. ${e(l.wrong)}</button><div id="feedback" class="answer" style="display:none"></div></section>`;if(l.id==='5.2')parts+=`<section class="card"><h3>Extra practice</h3><p>An assistant can issue refunds, has 98% task accuracy, and no alert for incorrect refunds. Which risk-register fields are still missing?</p><details><summary>Reveal suggested answer</summary><p>The score does not specify the refund error's mechanism, blast radius and reversibility, detection signal, enforcing control and control surface, or who accepted the residual risk. Add an approve-before-execute gate and a refund reconciliation alert; assign owners and test both.</p></details></section>`}
parts+=`<div class="actions"><button class="btn" onclick="${idx>0?'openLesson('+(idx-1)+')':'overview()'}">← ${idx>0?'Previous lesson':'Overview'}</button><button class="btn primary" onclick="toggleDone()">${saved(idx)?'✓ Completed (undo)':'Mark lesson complete ✓'}</button><button class="btn" onclick="${idx<L.length-1?'openLesson('+(idx+1)+')':'overview()'}">${idx<L.length-1?'Next lesson →':'Overview →'}</button></div><div class="source"><b>Original article and credit:</b> <a href="${e(l.url)}" target="_blank" rel="noopener noreferrer">${e(l.title)} · Claude Certification Guide</a>. This unofficial personal learning companion paraphrases and expands topics with independent enterprise examples; it is not a replacement for the original article, and is not affiliated with the publisher or Anthropic. Open the original lesson for complete source depth and authoritative wording.</div>`;$('content').innerHTML=parts}
function showAnswer(ok){let el=$('feedback');el.style.display='block';el.innerHTML=ok?'<b>Correct.</b> '+e(L[idx].objective):'<b>Try again.</b> '+e(L[idx].pitfall)}
function riskTable(){return `<section class="card"><h2>Risk Register — practical example</h2><p>Use all five fields for every risk. The values below are a fictional API Security case.</p><div class="scroll"><table><thead><tr><th>Field</th><th>What to write</th><th>Example</th></tr></thead><tbody><tr><td><b>Mechanism</b></td><td>Exact way the system fails</td><td>Model invents a supported Remote Engine version</td></tr><tr><td><b>Blast radius</b></td><td>Who is harmed; scale; reversible?</td><td>Wrong recommendation could break customer deployment</td></tr><tr><td><b>Detection signal</b></td><td>Observable metric, test, trace or alert</td><td>Version checker rejects unsupported recommendation</td></tr><tr><td><b>Owning control</b></td><td>Enforced safeguard and control surface</td><td>Output validator + documentation-version lookup; owner: platform team</td></tr><tr><td><b>Residual and acceptance</b></td><td>Remaining exposure and who explicitly signs off</td><td>Documentation may lag a new release; release owner accepts with human fallback</td></tr></tbody></table></div><p class="why"><b>Important:</b> “The customer will complain” is not an adequate early detection signal. Build a way to detect the problem before harm wherever possible.</p></section>`}
overview();
</script></body></html>
