<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 3 — Expanded Study Guide</title><style>
:root{--a:#0e7490;--b:#10b981;--wash:#e7fdf6;--ink:#172339;--muted:#59677c;--line:#e7e9f0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 0%,color-mix(in srgb,var(--b) 13%,white),transparent 40%),#f7f8fc;color:var(--ink);font:16px/1.7 system-ui,-apple-system,Segoe UI,Arial,sans-serif}button{font:inherit;cursor:pointer}a{color:var(--a)}.layout{display:grid;grid-template-columns:305px minmax(0,1fr);min-height:100vh}.sidebar{height:100vh;overflow:auto;position:sticky;top:0;padding:24px 16px;background:linear-gradient(180deg,#fff,var(--wash));border-right:1px solid #e0e5ef}.brand{font-size:12px;letter-spacing:.14em;font-weight:900;color:var(--a)}.sidebar h1{font-size:22px;line-height:1.22;margin:12px 0}.note{font-size:12px;color:var(--muted)}.meter{height:10px;background:#e5e9f1;border-radius:20px;overflow:hidden;margin:15px 0}.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}.navbutton{display:block;border:1px solid transparent;background:transparent;text-align:left;width:100%;margin:5px 0;padding:11px 12px;border-radius:14px;color:#27344b}.navbutton:hover{background:white}.navbutton.active{background:linear-gradient(110deg,color-mix(in srgb,var(--a) 13%,white),color-mix(in srgb,var(--b) 12%,white));border-color:color-mix(in srgb,var(--a) 20%,white);font-weight:800;box-shadow:0 5px 19px #141c3010}.navbutton small{display:block;color:var(--muted);font-size:11px}.main{width:100%;max-width:1230px;margin:auto;padding:32px clamp(18px,4vw,62px) 80px}.hero{color:white;padding:32px;border-radius:26px;background:linear-gradient(115deg,var(--a),var(--b));box-shadow:0 16px 36px #1920361a}.hero h1{font-size:clamp(27px,3.5vw,43px);line-height:1.17;margin:10px 0}.hero a{color:white}.hero p{max-width:900px}.kicker{font-size:12px;letter-spacing:.14em;font-weight:900;text-transform:uppercase}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.tab,.btn{border:1px solid #e1e6ef;background:white;padding:10px 15px;border-radius:13px;color:#2c3b50;box-shadow:0 3px 10px #11202f09}.tab.active,.btn.primary{background:linear-gradient(115deg,var(--a),var(--b));color:white;border-color:transparent}.card{background:white;border:1px solid #e9eaf1;box-shadow:0 8px 24px #1822380b;border-radius:20px;padding:24px;margin:15px 0}.card h2{font-size:23px;line-height:1.3;margin:0 0 10px}.card h3{font-size:18px;margin:0 0 8px}.card p{margin:8px 0}.key{background:linear-gradient(115deg,var(--wash),white);border-left:6px solid var(--a)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.grid>.card{margin:0}.topic{border-left:5px solid var(--b)}.topic h3{color:var(--a)}.why{background:var(--wash);padding:13px 15px;border-radius:12px;margin-top:13px!important}.muted{color:var(--muted)}.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--a);font-weight:900}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.flash{padding:37px 26px;min-height:170px;border:2px dashed var(--b);border-radius:19px;background:var(--wash);cursor:pointer;text-align:center;font-weight:800;font-size:20px}.choice{width:100%;display:block;text-align:left;border:1px solid #dce1ea;background:white;border-radius:13px;padding:13px;margin:10px 0}.choice:hover{border-color:var(--a)}.answer{margin:15px 0;padding:14px;border-radius:12px;background:var(--wash)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:11px;text-align:left;vertical-align:top;border-bottom:1px solid #e6eaf1}th{background:var(--wash)}.scroll{overflow-x:auto}.lesson-tile{display:block;width:100%;background:white;text-align:left;border:1px solid #e4e8ef;border-radius:16px;padding:18px;min-height:128px}.lesson-tile:hover{border-color:var(--b);transform:translateY(-1px)}.lesson-tile strong{display:block}.source{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;margin-top:38px}ol li{margin-bottom:10px}@media(max-width:850px){.layout{display:block}.sidebar{height:auto;position:relative;max-height:370px}.navlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:17px}.hero{padding:23px}.card{padding:18px}}@media(max-width:500px){.navlist{grid-template-columns:1fr}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand">AI ARCHITECT · DEEP STUDY</div><h1>🔌 Chapter 3<br>Integration</h1><div class="note" id="count"></div><div class="meter"><div id="meter"></div></div><button class="navbutton" id="homebtn" onclick="overview()"><b>⌂ Chapter overview</b></button><div class="navlist" id="nav"></div><p class="note">Progress saved in this browser. Original: <a href="https://claudecertificationguide.com/ccar-p/learn" target="_blank" rel="noopener">Claude Certification Guide</a>.</p></aside><main class="main" id="content"></main></div><script>
const DATA={"num":3,"name":"Integration","lessons":[{"id":"3.1","title":"Capability Bloat and Least-Privilege Configuration","url":"https://claudecertificationguide.com/ccar-p/learn/3-integration/3-1-capability-bloat","objective":"Give an agent only the tools and permissions needed for its job.","example":"An assistant that only reads API inventory should not have delete-integration or edit-policy tools.","strategy":"List the task; remove unused tools; scope remaining credentials; add explicit approval for sensitive actions.","pitfall":"A prompt saying “never delete” is not a security boundary. Remove the delete capability.","question":"An inventory-report agent has a production-delete tool it never uses. What is the best fix?","right":"Remove the delete tool","wrong":"Keep it but add a warning","topics":[["Capability bloat: tools are attack surface","An AI assistant may have dozens of available tools, but every tool makes one more action possible. A tool that is never needed for the job still creates risk and makes selecting the right tool harder.","For a read-only API inventory assistant, expose inventory lookup and reporting only; do not register integration deletion."],["Least privilege and capability removal","Start from the work the user must complete, then grant only the minimum permissions for that work. Removing a tool is stronger than telling the model not to use it. Credential scope must match tool scope.","A token limited to one customer tenant still needs resource-level authorization inside that tenant."],["Capability design versus approval","For legitimately necessary but sensitive actions, limit the parameters and require explicit approval before execution. Approval is a secondary control, not a reason to retain unnecessary tools.","A production configuration change can be drafted by the assistant and approved by the operator before execution."],["Tool discovery and context load","An enormous tool menu consumes context and can worsen selection quality. A small stable core plus on-demand capability discovery improves focus, but the discovery round trip adds time.","Keep frequently used read-only tools available; look up rare cloud-specific tools when needed."]]},{"id":"3.2","title":"Authentication, Authorisation, and the Gaps Between","url":"https://claudecertificationguide.com/ccar-p/learn/3-integration/3-2-authentication-authorisation-gaps","objective":"Authentication proves who is calling; authorisation decides what that identity may do.","example":"A support agent authenticates to a case system, but must only read customer cases it is allowed to access.","strategy":"Identify caller and tenant; check access on each resource; use scoped tokens; audit denied actions.","pitfall":"A valid login does not mean permission to access every customer record.","question":"A user has a valid token but requests another tenant’s data. What check matters?","right":"Resource-level authorisation","wrong":"Check only that the token is signed","topics":[["Authentication: who is calling?","Authentication verifies an identity, such as a user, service, or agent. A valid token answers who the caller claims to be; it does not say which records are allowed.","A support engineer can log in successfully and still be forbidden from viewing another customer tenant."],["Authorisation: what may they do?","Authorization evaluates the action, resource, tenant, and current policy. It should be checked at the service/tool boundary, not inferred from a successful login.","Check read permission on each case and deny cross-tenant access even if the API key is valid."],["Confused deputy and delegated access","An agent may be authenticated with a powerful service account and act on behalf of a less-privileged user. Without delegated authorization, the model can become a route to broader access.","Avoid one shared admin token for all users. Carry end-user scope through connector operations."],["Lifecycle of credentials","Use scoped credentials, short lifetimes where appropriate, rotation, revocation, audit, and rejection handling. Do not put secrets inside prompt text or logs.","Use a secret manager for connector tokens and log the permission decision rather than token contents."]]},{"id":"3.3","title":"Accuracy–Latency Trade-offs","url":"https://claudecertificationguide.com/ccar-p/learn/3-integration/3-3-accuracy-latency-trade-offs","objective":"More checking can improve answer quality, but usually adds time and cost.","example":"A live API incident dashboard needs fast triage; an overnight compliance report can afford deeper checks.","strategy":"Define acceptable quality and p95 latency; measure options; route harder cases to additional steps.","pitfall":"Do not put a long multi-agent workflow on a strict real-time response path without evidence.","question":"A 2-second SLA is being missed by sequential reviews. Best first step?","right":"Measure per-stage latency and simplify the critical path","wrong":"Add another review step","topics":[["Accuracy, latency and cost are linked","More retrieval passes, stronger models, and repeated review can improve results, but increase waiting time and spend. Compare designs using the quality they actually deliver.","For a live alert dashboard, a quick reliable first summary may matter more than a multi-minute investigation."],["Critical path and percentile latency","Sequential stages add up. Parallel independent stages may reduce wall-clock duration; p95 and p99 expose slow users hidden by average latency.","Measure retrieval time, model time, tool time, retries, and approval delay separately."],["Risk-based escalation","Do not make every request expensive. Route straightforward cases through simple paths and escalate ambiguous or high-impact cases to deeper analysis.","Routine inventory questions use one retrieval-and-answer call; a potential breach investigation triggers additional checks."],["Measure the frontier","Choose among candidate designs using the same evaluation set and an explicit quality floor, latency budget and cost ceiling.","A faster solution only wins if it still meets the approved correctness and safety thresholds."]]},{"id":"3.4","title":"Observability and Monitoring at Scale","url":"https://claudecertificationguide.com/ccar-p/learn/3-integration/3-4-observability-at-scale","objective":"Track what the model, tools and retrieval actually did so you can explain failures.","example":"For an API incident assistant, capture request ID, selected tools, retrieved cases, response time and cost without leaking secrets.","strategy":"Trace every stage; use correlation IDs; monitor quality and failures; alert on trends; redact sensitive data.","pitfall":"Server uptime alone does not show whether an AI answer is correct.","question":"An answer is wrong but all servers are healthy. What is missing?","right":"Model/retrieval quality telemetry","wrong":"A larger VM","topics":[["Trace the whole request","Infrastructure logs are not enough. To explain an incorrect answer, capture prompt version, retrieved evidence IDs, chosen tools, tool outcomes, model output and validation result with one correlation ID.","A wrong API endpoint in an answer can be traced back to a stale retrieved article or an invented field."],["Quality telemetry versus uptime","A system can return 200 OK and still be wrong. Monitor evidence coverage, hallucination or unsupported-claim findings, refusal behavior, and user corrections alongside availability.","Detect an increase in wrong integration classifications even when pods and APIs are healthy."],["Operational signal and ownership","Metrics need alert thresholds, named owners, escalation, and an incident response playbook. Avoid alerting on everything; choose signals that indicate meaningful degradation.","Page when a harmful-action guard fails; trend nonurgent summary-quality drift for review."],["Protect sensitive trace data","Traceability must not turn logs into a second unsecured data store. Mask secrets and personal data; control access and retention.","Record that a token check failed, never the raw token value."]]},{"id":"3.5","title":"RAG Pipeline Design: Chunking and Indexing","url":"https://claudecertificationguide.com/ccar-p/learn/3-integration/3-5-rag-pipeline-design","objective":"Split documents into useful pieces, add metadata and index them so the right evidence can be found.","example":"Chunk integration troubleshooting guides by symptom, prerequisite and repair step, with product/version metadata.","strategy":"Clean files; chunk on meaningful boundaries; preserve titles and source IDs; build index; test retrieval.","pitfall":"Tiny chunks lose context; huge chunks bury the answer.","question":"A retrieved configuration line lacks its version and warning. Improve what?","right":"Chunk boundaries and metadata","wrong":"The assistant tone","topics":[["RAG has more than a vector database","Retrieval-augmented generation uses prepared sources, chunking, indexing, retrieval, and answer grounding. Wrong answers may begin at any of these stages.","A correct Helm chart document is useless if indexing omitted the relevant version section."],["Meaningful chunk boundaries","Chunk by headings, procedures, tables, or other semantic units. Extremely short chunks lose prerequisite context; very large chunks reduce precision. Preserve heading lineage.","Keep a command together with the warning and product version that qualify it."],["Metadata and provenance","Index source URL, title, version, publication or update time, tenant or ACL, and segment IDs where available. These enable filtering and evidence links.","Filter integration docs to the deployment version instead of retrieving incompatible instructions."],["Evaluate retrieval separately","Use query-to-evidence test cases and inspect recall, relevance, ranking, and missing sections before blaming the answer model.","For a known error message, verify the correct troubleshooting step appears among the retrieved results."]]},{"id":"3.6","title":"Matching Retrieval to Data Shape and Query Pattern","url":"https://claudecertificationguide.com/ccar-p/learn/3-integration/3-6-retrieval-strategy-matching","objective":"Choose search based on the question and the shape of the data, not by habit.","example":"Exact case IDs benefit from keyword lookup; “similar Azure failures” benefits from semantic retrieval.","strategy":"Classify query as exact, semantic, structured or mixed; select lexical/vector/SQL/hybrid; rerank and validate.","pitfall":"Vector search is not the best answer to every exact identifier query.","question":"A user searches GTS-25716. What should take priority?","right":"Exact/lexical matching","wrong":"Semantic similarity only","topics":[["Exact lookup","IDs, error codes, versions, usernames and exact phrases benefit from lexical or structured search. Embedding similarity is not a substitute for exact equality.","Search GTS-25716 using exact identifier matching before a similarity search."],["Semantic retrieval","Natural-language questions phrased differently than a document can benefit from embeddings that match meaning instead of exact tokens.","Find cases describing intermittent Azure failures even if the user says “sporadic auth error.”"],["Structured and hybrid retrieval","SQL or filtered APIs answer precise numeric and attribute questions. Hybrid keyword-plus-vector retrieval and reranking help mixed queries.","For “recent open Azure APIM cases,” filter by status/date and retrieve semantically within that set."],["Query patterns dictate indexes","Choose by query distribution and underlying data shape; use evaluation queries with expected results to compare strategies.","Do not embed a transaction table and hope a vector index computes authoritative financial totals."]]},{"id":"3.7","title":"Choosing the Integration Mechanism","url":"https://claudecertificationguide.com/ccar-p/learn/3-integration/3-7-integration-mechanisms","objective":"Pick tools, APIs and connectors based on the action, reliability and security needs.","example":"Use a read-only API connector to inspect Remote Engine status, not a broad shell with production access.","strategy":"List needed operations; compare supported interfaces; choose least privileged; design errors and retries.","pitfall":"Choose the narrowest supported integration mechanism, not the most powerful one.","question":"An assistant only needs a case summary. Which interface is preferable?","right":"Scoped read-only case API","wrong":"Unrestricted infrastructure shell","topics":[["Choose a mechanism by required operation","Consider direct API, built-in tool, MCP integration, event, batch job, and retrieval. Choose based on what data must move and what action must be performed.","A status lookup should use a narrowly scoped API rather than shell access."],["Contract, error and retry semantics","Document schema, permission scope, timeouts, rate limits, retry behavior and idempotency. A working demo without these contracts is not production ready.","Retry read-only inventory calls safely; use idempotency keys for effectful actions."],["Trust boundaries","Each new connector crosses a boundary. Account for where credentials live, what a third party receives, and whether a tool can mutate state.","A hosted MCP endpoint may process data outside the original application’s retention arrangement."],["Operational fitness","Prefer documented and supportable interfaces, traceable errors and clear fallback handling over maximum raw capability.","An integration that can be tested and audited beats a broad ad hoc script with uncertain privileges."]]},{"id":"3.8","title":"Progressive Discovery vs Monolithic Context","url":"https://claudecertificationguide.com/ccar-p/learn/3-integration/3-8-progressive-discovery","objective":"Load the information and tools needed now, rather than showing everything on every request.","example":"When troubleshooting an Azure connector, reveal Azure-specific tools first; only load Kubernetes diagnostics if needed.","strategy":"Start with a small capability directory; select relevant tools; load detailed schemas on demand; keep an audit trail.","pitfall":"A giant tool catalogue wastes tokens and can confuse tool selection.","question":"An agent has 200 rarely used tools. Better approach?","right":"Discover and load tools when relevant","wrong":"Send all schemas in every prompt","topics":[["Progressive discovery","Keep small, frequently used guidance and tool descriptions upfront; load uncommon details only when the task indicates they matter.","Start with API status tools; discover Azure remediation tools when troubleshooting Azure."],["Why a monolithic context struggles","A giant prompt increases token cost, distracts the model and can slow decisions even if the content fits the context window.","A 200-tool catalogue in every message makes selecting one correct tool harder."],["Discovery costs latency","Every look-up can add a round trip. If the same capability is needed in nearly all requests, preload it and benefit from cache reuse.","Put common read-only queries in the always-available core."],["Hybrid architecture","Use a stable core, tool search for rare actions, retrieval for reference knowledge, and reusable Skills for procedures. Measure coverage and latency.","When a cloud-specific troubleshooting workflow begins, load only that cloud’s procedures and tool schema."]]}],"emoji":"🔌"};const ID=DATA.num;const L=DATA.lessons;let idx=-1,tab='learn',flipped=false,answered=false;
const $=id=>document.getElementById(id);const e=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const saved=i=>localStorage.getItem('expanded-guide-'+ID+'-'+L[i].id)==='yes';
function refreshNav(){let count=L.filter((v,i)=>saved(i)).length;$('count').textContent=count+' / '+L.length+' completed';$('meter').style.width=(100*count/L.length)+'%';$('nav').innerHTML=L.map((l,i)=>`<button class="navbutton ${idx===i?'active':''}" onclick="openLesson(${i})"><b>${e(l.id)} ${e(l.title)}</b><small>${saved(i)?'✓ Completed':l.topics.length+' key concepts'}</small></button>`).join('');$('homebtn').classList.toggle('active',idx===-1)}
function overview(){idx=-1;render()}
function openLesson(i){idx=i;tab='learn';flipped=false;answered=false;window.__flashIndex=0;render();window.scrollTo(0,0)}
function switchTab(t){tab=t;flipped=false;answered=false;render()}
function toggleDone(){const key='expanded-guide-'+ID+'-'+L[idx].id;localStorage.setItem(key,saved(idx)?'no':'yes');render()}
function topicCard(t){return `<article class="card topic"><h3>${e(t[0])}</h3><p>${e(t[1])}</p><p class="why"><b>Apply it:</b> ${e(t[2])}</p></article>`}
function render(){refreshNav();if(idx<0){$('content').innerHTML=`<header class="hero"><div class="kicker">Expanded personal study · Chapter ${ID}</div><h1>${DATA.emoji} ${e(DATA.name)}</h1><p>In-depth, plain-English lessons covering key mechanisms, controls, architecture decisions, examples and practice. Read the detailed concept pages before taking the quiz.</p></header><section class="card"><h2>How to use this guide</h2><p>Choose a lesson in the sidebar. The <b>Learn</b> tab explains each major concept in its own section; <b>Strategy</b> provides a practical checklist; <b>Example</b> applies it to API Security; then test yourself with flashcards and a quiz. These are independently written learning notes with direct links to the original articles.</p></section><div class="grid">${L.map((l,i)=>`<button class="lesson-tile" onclick="openLesson(${i})"><span class="label">Lesson ${e(l.id)}</span><strong>${e(l.title)}</strong><span class="muted">${l.topics.length} concepts · ${saved(i)?'✓ Completed':'Begin →'}</span></button>`).join('')}</div>`;return}
const l=L[idx];let parts=`<header class="hero"><div class="kicker">Chapter ${ID} · Lesson ${e(l.id)}</div><h1>${e(l.title)}</h1><p>${e(l.objective)}</p><a href="${e(l.url)}" target="_blank" rel="noopener noreferrer">Read the original lesson ↗</a></header><nav class="tabs">${[['learn','📖 Learn'],['strategy','🧭 Strategy'],['example','🧩 Worked example'],['flash','🃏 Flashcards'],['quiz','✅ Quiz']].map(v=>`<button class="tab ${tab===v[0]?'active':''}" onclick="switchTab('${v[0]}')">${v[1]}</button>`).join('')}</nav>`;
if(tab==='learn'){parts+=`<section class="card key"><span class="label">Core learning objective</span><h2>${e(l.objective)}</h2><p>Learn each of the ${l.topics.length} concepts below; together they explain what can go wrong, what changes in the architecture, and how to decide in an exam scenario.</p></section>${l.topics.map(topicCard).join('')}`;if(l.id==='5.2')parts+=riskTable();parts+=`<section class="card"><h3>Common mistake to avoid</h3><p>${e(l.pitfall)}</p></section>`}
if(tab==='strategy'){parts+=`<section class="card"><h2>Architecture decision checklist</h2><ol>${l.strategy.split(';').map(v=>`<li>${e(v.trim())}</li>`).join('')}</ol></section><section class="card"><h2>How to defend the design</h2><p>Explain the requirement, the consequence of failure, the precise safeguard, the measurable evidence that it works, and who owns remaining risk. For this lesson, use the concepts below as your reference.</p></section>${l.topics.map((t,i)=>`<section class="card"><span class="label">Decision ${i+1}</span><h3>${e(t[0])}</h3><p>${e(t[2])}</p></section>`).join('')}`}
if(tab==='example'){parts+=`<section class="card"><h2>API Security worked scenario</h2><p>${e(l.example)}</p><h3>Walk through it</h3><ol><li>Identify the real-world problem and who could be affected if the assistant is wrong.</li><li>Find which of the lesson concepts explains the failure and the correct architecture boundary.</li><li>Choose a technical safeguard and a way to test or monitor it.</li><li>Document the decision, its limits and the accountable owner.</li></ol></section>${l.topics.map(t=>`<section class="card"><h3>${e(t[0])}</h3><p>${e(t[2])}</p></section>`).join('')}`}
if(tab==='flash'){const card=l.topics[window.__flashIndex||0];parts+=`<section class="card"><div class="label">Card ${(window.__flashIndex||0)+1} of ${l.topics.length}</div><button class="flash" style="width:100%" onclick="flipped=!flipped;render()">${flipped?e(card[1]):'Explain: '+e(card[0])}<div class="note">Tap to ${flipped?'see the prompt':'reveal the answer'}</div></button><div class="actions"><button class="btn" onclick="window.__flashIndex=Math.max(0,(window.__flashIndex||0)-1);flipped=false;render()">← Previous card</button><button class="btn primary" onclick="window.__flashIndex=((window.__flashIndex||0)+1)%L[idx].topics.length;flipped=false;render()">Next card →</button></div></section>`}
if(tab==='quiz'){parts+=`<section class="card"><h2>Knowledge check</h2><h3>${e(l.question)}</h3><button class="choice" onclick="showAnswer(true)">A. ${e(l.right)}</button><button class="choice" onclick="showAnswer(false)">B. ${e(l.wrong)}</button><div id="feedback" class="answer" style="display:none"></div></section>`;if(l.id==='5.2')parts+=`<section class="card"><h3>Extra practice</h3><p>An assistant can issue refunds, has 98% task accuracy, and no alert for incorrect refunds. Which risk-register fields are still missing?</p><details><summary>Reveal suggested answer</summary><p>The score does not specify the refund error's mechanism, blast radius and reversibility, detection signal, enforcing control and control surface, or who accepted the residual risk. Add an approve-before-execute gate and a refund reconciliation alert; assign owners and test both.</p></details></section>`}
parts+=`<div class="actions"><button class="btn" onclick="${idx>0?'openLesson('+(idx-1)+')':'overview()'}">← ${idx>0?'Previous lesson':'Overview'}</button><button class="btn primary" onclick="toggleDone()">${saved(idx)?'✓ Completed (undo)':'Mark lesson complete ✓'}</button><button class="btn" onclick="${idx<L.length-1?'openLesson('+(idx+1)+')':'overview()'}">${idx<L.length-1?'Next lesson →':'Overview →'}</button></div><div class="source"><b>Original article and credit:</b> <a href="${e(l.url)}" target="_blank" rel="noopener noreferrer">${e(l.title)} · Claude Certification Guide</a>. This unofficial personal learning companion paraphrases and expands topics with independent enterprise examples; it is not a replacement for the original article, and is not affiliated with the publisher or Anthropic. Open the original lesson for complete source depth and authoritative wording.</div>`;$('content').innerHTML=parts}
function showAnswer(ok){let el=$('feedback');el.style.display='block';el.innerHTML=ok?'<b>Correct.</b> '+e(L[idx].objective):'<b>Try again.</b> '+e(L[idx].pitfall)}
function riskTable(){return `<section class="card"><h2>Risk Register — practical example</h2><p>Use all five fields for every risk. The values below are a fictional API Security case.</p><div class="scroll"><table><thead><tr><th>Field</th><th>What to write</th><th>Example</th></tr></thead><tbody><tr><td><b>Mechanism</b></td><td>Exact way the system fails</td><td>Model invents a supported Remote Engine version</td></tr><tr><td><b>Blast radius</b></td><td>Who is harmed; scale; reversible?</td><td>Wrong recommendation could break customer deployment</td></tr><tr><td><b>Detection signal</b></td><td>Observable metric, test, trace or alert</td><td>Version checker rejects unsupported recommendation</td></tr><tr><td><b>Owning control</b></td><td>Enforced safeguard and control surface</td><td>Output validator + documentation-version lookup; owner: platform team</td></tr><tr><td><b>Residual and acceptance</b></td><td>Remaining exposure and who explicitly signs off</td><td>Documentation may lag a new release; release owner accepts with human fallback</td></tr></tbody></table></div><p class="why"><b>Important:</b> “The customer will complain” is not an adequate early detection signal. Build a way to detect the problem before harm wherever possible.</p></section>`}
overview();
</script></body></html>
