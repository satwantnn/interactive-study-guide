<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Unofficial personal AI architecture learning guide, chapter 3"><title>Chapter 3 – Integration | Interactive Study Guide</title><style>

:root{--bg1:#F2FBFA;--bg2:#F6F5FF;--surface:rgba(255,255,255,.82);--surface-strong:#ffffff;--text:#172033;--muted:#596579;--line:rgba(148,163,184,.22);--accent:#0F766E;--accent2:#06B6D4;--accent3:#6EE7B7;--wash:#E6FFFB;--wash2:#ECFEFF;--side1:#F8FFFE;--side2:#F2F7FF;--shadow:0 18px 45px rgba(15,23,42,.08);--shadow-soft:0 10px 24px rgba(15,23,42,.06);--glow:0 10px 30px color-mix(in srgb, var(--accent2) 18%, transparent);}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.68 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top left, color-mix(in srgb, var(--accent2) 10%, white) 0%, transparent 28%),radial-gradient(circle at top right, color-mix(in srgb, var(--accent3) 12%, white) 0%, transparent 24%),linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text)}
a{color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
button{font:inherit;cursor:pointer;transition:all .18s ease}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--side1),var(--side2));border-right:1px solid rgba(255,255,255,.75);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;backdrop-filter:blur(12px);box-shadow:inset -1px 0 0 rgba(255,255,255,.75)}
.logo{font-weight:900;color:var(--accent);letter-spacing:.09em;font-size:12px;text-transform:uppercase}
.side h2{line-height:1.12;font-size:21px;margin:12px 0 8px}
.sub{color:var(--muted);font-size:13px}
.navbtn{display:block;text-align:left;width:100%;border:1px solid transparent;border-radius:18px;background:transparent;padding:13px 14px;margin:6px 0;color:#22304a;box-shadow:none}
.navbtn:hover{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.85);transform:translateY(-1px)}
.navbtn.active{background:linear-gradient(135deg,color-mix(in srgb, var(--accent) 14%, white),color-mix(in srgb, var(--accent2) 14%, white));color:#102033;font-weight:800;border-color:color-mix(in srgb, var(--accent2) 18%, white);box-shadow:var(--shadow-soft)}
.navbtn small{display:block;color:#64748b;font-weight:500;margin-top:5px}
.progress{height:11px;background:rgba(255,255,255,.72);overflow:hidden;border-radius:999px;margin:15px 0 8px;border:1px solid rgba(255,255,255,.72)}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));transition:width .25s ease}
.main{padding:30px clamp(18px,5vw,70px) 72px;max-width:1280px;width:100%;margin:0 auto}
.hero{padding:34px;border-radius:28px;background:linear-gradient(135deg,var(--accent),var(--accent2) 55%, var(--accent3));color:#fff;margin-bottom:26px;box-shadow:0 22px 50px color-mix(in srgb, var(--accent2) 22%, transparent);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at top right, rgba(255,255,255,.24), transparent 30%),linear-gradient(120deg, transparent 0 35%, rgba(255,255,255,.06) 35% 42%, transparent 42% 58%, rgba(255,255,255,.05) 58% 65%, transparent 65% 100%);pointer-events:none}
.hero > *{position:relative;z-index:1}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.96}
.hero h1{margin:10px 0 10px;font-size:clamp(29px,4vw,44px);line-height:1.12;max-width:1000px}
.hero p{max-width:780px;opacity:.97;font-size:18px;margin-top:0}
.hero a{color:white;font-weight:700}
.pill{display:inline-block;border:1px solid rgba(255,255,255,.52);background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;margin-top:8px;box-shadow:0 8px 22px rgba(255,255,255,.08)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tab{border:1px solid rgba(148,163,184,.22);background:rgba(255,255,255,.7);backdrop-filter:blur(6px);padding:10px 15px;border-radius:14px;color:#334155;box-shadow:var(--shadow-soft)}
.tab:hover{transform:translateY(-1px);border-color:color-mix(in srgb, var(--accent2) 24%, white)}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border-color:transparent;box-shadow:var(--glow)}
.panel{display:none}
.panel.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(10px);border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::after{content:'';position:absolute;inset:auto -30% -65% auto;width:180px;height:180px;background:radial-gradient(circle, color-mix(in srgb, var(--accent3) 13%, white), transparent 68%);pointer-events:none}
.card > *{position:relative;z-index:1}
.card h3{margin:0 0 11px;font-size:18px}
.card p{margin:6px 0 0}
.core{border-left:8px solid var(--accent);background:linear-gradient(135deg,var(--wash),var(--wash2))}
.objective{border-left:6px solid var(--accent2)}
.tag{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:10px}
.callout{background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,255,255,.66));padding:15px;border-radius:16px;margin:12px 0;border:1px solid rgba(255,255,255,.8)}
.step{display:flex;gap:13px;margin:15px 0;align-items:flex-start}
.step .num{flex:0 0 36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;text-align:center;line-height:36px;font-weight:850;box-shadow:var(--glow)}
.quizopt{display:block;width:100%;border:1px solid rgba(148,163,184,.24);border-radius:16px;background:rgba(255,255,255,.82);padding:15px 16px;text-align:left;margin:10px 0;box-shadow:var(--shadow-soft)}
.quizopt:hover{border-color:color-mix(in srgb, var(--accent2) 28%, white);transform:translateY(-1px)}
.feedback{font-weight:800;min-height:28px;margin-top:13px}
.flash{background:linear-gradient(135deg,var(--wash),var(--wash2));border:2px dashed color-mix(in srgb, var(--accent2) 55%, white);padding:30px;border-radius:24px;text-align:center;cursor:pointer;min-height:180px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;box-shadow:var(--shadow-soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.primary,.secondary{border-radius:16px;padding:12px 18px;border:0;box-shadow:var(--shadow-soft)}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}
.primary:hover{transform:translateY(-1px);box-shadow:var(--glow)}
.secondary{background:rgba(255,255,255,.78);border:1px solid rgba(148,163,184,.22)}
.secondary:hover{transform:translateY(-1px)}
.footer{margin-top:40px;border-top:1px solid rgba(148,163,184,.18);padding-top:18px;color:var(--muted);font-size:13px}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.lessoncard{text-align:left;border:1px solid rgba(255,255,255,.86);border-radius:22px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);padding:18px;min-height:136px;box-shadow:var(--shadow)}
.lessoncard:hover{border-color:color-mix(in srgb, var(--accent2) 24%, white);background:linear-gradient(135deg,var(--wash),#ffffff);transform:translateY(-2px)}
.lessoncard strong{display:block;margin:7px 0}
.lessoncard small{color:var(--muted)}
.hide{display:none}
@media(max-width:800px){.app{display:block}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid rgba(255,255,255,.8);padding:16px}.side h2{font-size:18px}.navlist{display:flex;overflow:auto;gap:8px;padding-bottom:4px}.navbtn{flex:0 0 185px;white-space:normal}.main{padding:17px}.hero{padding:24px;border-radius:24px}.hero p{font-size:16px}}

</style></head><body><div class="app"><aside class="side"><div class="logo">AI ARCHITECTURE · PERSONAL STUDY</div><h2>Chapter 3<br>Integration</h2><div class="sub" id="pct"></div><div class="progress"><div id="bar" class="bar"></div></div><button class="navbtn" onclick="overview()"><b>⌂ Chapter overview</b></button><div id="nav" class="navlist"></div><p class="sub">Your progress is stored only in this browser.</p><p class="sub"><a href="https://claudecertificationguide.com/ccar-p/learn" target="_blank" rel="noopener">Original CCAR-P curriculum ↗</a></p></aside><main class="main" id="content"></main></div><script>
const DATA={"num": 3, "name": "Integration", "lessons": [{"id": "3.1", "title": "Capability Bloat and Least-Privilege Configuration", "url": "https://claudecertificationguide.com/ccar-p/learn/3-integration/3-1-capability-bloat", "objective": "Give an agent only the tools and permissions needed for its job.", "example": "An assistant that only reads API inventory should not have delete-integration or edit-policy tools.", "strategy": "List the task; remove unused tools; scope remaining credentials; add explicit approval for sensitive actions.", "pitfall": "A prompt saying “never delete” is not a security boundary. Remove the delete capability.", "question": "An inventory-report agent has a production-delete tool it never uses. What is the best fix?", "right": "Remove the delete tool", "wrong": "Keep it but add a warning"}, {"id": "3.2", "title": "Authentication, Authorisation, and the Gaps Between", "url": "https://claudecertificationguide.com/ccar-p/learn/3-integration/3-2-authentication-authorisation-gaps", "objective": "Authentication proves who is calling; authorisation decides what that identity may do.", "example": "A support agent authenticates to a case system, but must only read customer cases it is allowed to access.", "strategy": "Identify caller and tenant; check access on each resource; use scoped tokens; audit denied actions.", "pitfall": "A valid login does not mean permission to access every customer record.", "question": "A user has a valid token but requests another tenant’s data. What check matters?", "right": "Resource-level authorisation", "wrong": "Check only that the token is signed"}, {"id": "3.3", "title": "Accuracy–Latency Trade-offs", "url": "https://claudecertificationguide.com/ccar-p/learn/3-integration/3-3-accuracy-latency-trade-offs", "objective": "More checking can improve answer quality, but usually adds time and cost.", "example": "A live API incident dashboard needs fast triage; an overnight compliance report can afford deeper checks.", "strategy": "Define acceptable quality and p95 latency; measure options; route harder cases to additional steps.", "pitfall": "Do not put a long multi-agent workflow on a strict real-time response path without evidence.", "question": "A 2-second SLA is being missed by sequential reviews. Best first step?", "right": "Measure per-stage latency and simplify the critical path", "wrong": "Add another review step"}, {"id": "3.4", "title": "Observability and Monitoring at Scale", "url": "https://claudecertificationguide.com/ccar-p/learn/3-integration/3-4-observability-at-scale", "objective": "Track what the model, tools and retrieval actually did so you can explain failures.", "example": "For an API incident assistant, capture request ID, selected tools, retrieved cases, response time and cost without leaking secrets.", "strategy": "Trace every stage; use correlation IDs; monitor quality and failures; alert on trends; redact sensitive data.", "pitfall": "Server uptime alone does not show whether an AI answer is correct.", "question": "An answer is wrong but all servers are healthy. What is missing?", "right": "Model/retrieval quality telemetry", "wrong": "A larger VM"}, {"id": "3.5", "title": "RAG Pipeline Design: Chunking and Indexing", "url": "https://claudecertificationguide.com/ccar-p/learn/3-integration/3-5-rag-pipeline-design", "objective": "Split documents into useful pieces, add metadata and index them so the right evidence can be found.", "example": "Chunk integration troubleshooting guides by symptom, prerequisite and repair step, with product/version metadata.", "strategy": "Clean files; chunk on meaningful boundaries; preserve titles and source IDs; build index; test retrieval.", "pitfall": "Tiny chunks lose context; huge chunks bury the answer.", "question": "A retrieved configuration line lacks its version and warning. Improve what?", "right": "Chunk boundaries and metadata", "wrong": "The assistant tone"}, {"id": "3.6", "title": "Matching Retrieval to Data Shape and Query Pattern", "url": "https://claudecertificationguide.com/ccar-p/learn/3-integration/3-6-retrieval-strategy-matching", "objective": "Choose search based on the question and the shape of the data, not by habit.", "example": "Exact case IDs benefit from keyword lookup; “similar Azure failures” benefits from semantic retrieval.", "strategy": "Classify query as exact, semantic, structured or mixed; select lexical/vector/SQL/hybrid; rerank and validate.", "pitfall": "Vector search is not the best answer to every exact identifier query.", "question": "A user searches GTS-25716. What should take priority?", "right": "Exact/lexical matching", "wrong": "Semantic similarity only"}, {"id": "3.7", "title": "Choosing the Integration Mechanism", "url": "https://claudecertificationguide.com/ccar-p/learn/3-integration/3-7-integration-mechanisms", "objective": "Pick tools, APIs and connectors based on the action, reliability and security needs.", "example": "Use a read-only API connector to inspect Remote Engine status, not a broad shell with production access.", "strategy": "List needed operations; compare supported interfaces; choose least privileged; design errors and retries.", "pitfall": "Choose the narrowest supported integration mechanism, not the most powerful one.", "question": "An assistant only needs a case summary. Which interface is preferable?", "right": "Scoped read-only case API", "wrong": "Unrestricted infrastructure shell"}, {"id": "3.8", "title": "Progressive Discovery vs Monolithic Context", "url": "https://claudecertificationguide.com/ccar-p/learn/3-integration/3-8-progressive-discovery", "objective": "Load the information and tools needed now, rather than showing everything on every request.", "example": "When troubleshooting an Azure connector, reveal Azure-specific tools first; only load Kubernetes diagnostics if needed.", "strategy": "Start with a small capability directory; select relevant tools; load detailed schemas on demand; keep an audit trail.", "pitfall": "A giant tool catalogue wastes tokens and can confuse tool selection.", "question": "An agent has 200 rarely used tools. Better approach?", "right": "Discover and load tools when relevant", "wrong": "Send all schemas in every prompt"}]};const chapter=DATA.num,lessons=DATA.lessons;let current=-1, tab='learn', flipped=false;const prefix='ai-study-ch'+chapter+'-';const $=x=>document.getElementById(x), esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');function done(i){return localStorage.getItem(prefix+lessons[i].id)==='1'}function setProgress(){let n=lessons.filter((_,i)=>done(i)).length;$('pct').innerText=n+' / '+lessons.length+' completed';$('bar').style.width=(100*n/lessons.length)+'%';document.querySelectorAll('#nav .navbtn').forEach((b,i)=>{b.querySelector('.status').textContent=done(i)?'✓ Completed':'Not completed'});}function renderNav(){ $('nav').innerHTML=lessons.map((l,i)=>`<button class="navbtn" onclick="openLesson(${i})"><b>${esc(l.id)} ${esc(l.title)}</b><small class="status"></small></button>`).join('');setProgress()}function openLesson(i){current=i;tab='learn';flipped=false;document.querySelectorAll('#nav .navbtn').forEach((b,j)=>b.classList.toggle('active',i===j));document.querySelector('.side > .navbtn').classList.remove('active');render();window.scrollTo({top:0,behavior:'instant'})}function overview(){current=-1;document.querySelectorAll('#nav .navbtn').forEach(b=>b.classList.remove('active'));document.querySelector('.side > .navbtn').classList.add('active');render()}function render(){if(current<0){$('content').innerHTML=`<section class="hero"><div class="eyebrow">Personal learning companion · Chapter ${chapter}</div><h1>${esc(DATA.name)}</h1><p>Simple English, colorful core objectives, practical API Security examples, strategies, flashcards and self-check questions.</p><span class="pill">${lessons.length} lessons</span></section><div class="card"><h3>How to study</h3><p>Open a lesson → read the core objective → review the example and strategy → answer the quiz → mark complete. Your progress is saved on this browser.</p></div><div class="overview">${lessons.map((l,i)=>`<button class="lessoncard" onclick="openLesson(${i})"><small>Lesson ${esc(l.id)}</small><strong>${esc(l.title)}</strong><small>${done(i)?'✓ Completed':'Start lesson →'}</small></button>`).join('')}</div>`;return;}let l=lessons[current];$('content').innerHTML=`<div class="hero"><div class="eyebrow">Chapter ${chapter} · Lesson ${esc(l.id)}</div><h1>${esc(l.title)}</h1><p>One core concept, one practical scenario, and one decision rule to remember.</p><a href="${l.url}" target="_blank" rel="noopener noreferrer">Read original article ↗</a></div><div class="tabs">${[['learn','Learn'],['strategy','Strategy'],['example','Worked example'],['flash','Flashcard'],['quiz','Quiz']].map(([k,v])=>`<button class="tab ${tab===k?'active':''}" onclick="showTab('${k}')">${v}</button>`).join('')}</div><div id="body"></div><div class="actions"><button class="secondary" onclick="${current?'openLesson('+(current-1)+')':'overview()'}">← ${current?'Previous lesson':'Chapter overview'}</button><button class="primary" onclick="localStorage.setItem(prefix+'${l.id}',done(${current})?'0':'1');setProgress();render()">${done(current)?'✓ Completed (click to undo)':'Mark lesson complete ✓'}</button><button class="secondary" onclick="${current<lessons.length-1?'openLesson('+(current+1)+')':'overview()'}">${current<lessons.length-1?'Next lesson →':'Chapter overview →'}</button></div><div class="footer">Original learning source: <a href="${l.url}" target="_blank" rel="noopener noreferrer">AI Cert Guides / Claude Certification Guide – lesson ${esc(l.id)}</a>. This is an unofficial independently written personal learning aid. It is not endorsed by or affiliated with the course publisher or Anthropic.</div>`;drawTab()}function showTab(v){tab=v;flipped=false;render()}function drawTab(){let l=lessons[current],b=$('body');if(tab==='learn')b.innerHTML=`<div class="card core"><div class="tag">Core objective · remember this</div><h3>${esc(l.objective)}</h3></div><div class="cards"><div class="card objective"><div class="tag">In plain English</div><p>${esc(l.objective)}</p></div><div class="card objective"><div class="tag">Architecture rule</div><p>${esc(l.pitfall)}</p></div></div><div class="card"><h3>What you should be able to explain</h3><p>1. What problem this concept solves.</p><p>2. How to apply it to a real enterprise AI workflow.</p><p>3. Which common mistake to avoid.</p></div>`;if(tab==='strategy')b.innerHTML=`<div class="card"><div class="tag">Decision strategy</div><h3>How to approach an exam or design scenario</h3>${l.strategy.split('; ').map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div>${esc(s.charAt(0).toUpperCase()+s.slice(1))}</div></div>`).join('')}</div><div class="card core"><div class="tag">Exam decision tip</div><p>${esc(l.pitfall)}</p></div>`;if(tab==='example')b.innerHTML=`<div class="card"><div class="tag">API Security scenario · illustrative</div><h3>How this appears at work</h3><p>${esc(l.example)}</p></div><div class="card objective"><div class="tag">What to do</div><p>${esc(l.strategy)}</p></div><div class="card"><h3>Explain it to a colleague</h3><p>“${esc(l.objective)}”</p><p class="sub">Think about how this changes architecture, permissions, speed, quality, cost, or operational risk.</p></div>`;if(tab==='flash')b.innerHTML=`<div class="card"><h3>Recall the main lesson without looking</h3><div class="flash" onclick="flipped=!flipped;drawTab()">${flipped?esc(l.objective):'What is the core architectural lesson of '+esc(l.id)+'?'}<br><small style="font-size:12px">Tap to ${flipped?'hide':'reveal'} answer</small></div><p class="sub">Try to say the answer in your own words before flipping.</p></div>`;if(tab==='quiz')b.innerHTML=`<div class="card"><div class="tag">Knowledge check</div><h3>${esc(l.question)}</h3><button class="quizopt" onclick="answer(true)">A. ${esc(l.right)}</button><button class="quizopt" onclick="answer(false)">B. ${esc(l.wrong)}</button><div class="feedback" id="feedback" aria-live="polite"></div><p class="sub">Answers are intentionally simple. Use the original article for full nuance.</p></div>`}function answer(ok){$('feedback').innerHTML=ok?'✅ Correct. '+esc(lessons[current].objective):'❌ Not quite. '+esc(lessons[current].pitfall)}renderNav();overview();
</script></body></html>
